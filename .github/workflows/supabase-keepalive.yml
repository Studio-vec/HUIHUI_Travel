name: Supabase keepalive

# 무료 플랜은 7일간 활동이 없으면 프로젝트를 일시정지한다.
# 빈 결과만 돌아오는 읽기(RLS에 막힌 profiles 조회)는 활동으로 치지 않아 2026-10에 실제로 멈췄다.
# 그래서 매일 keepalive() 함수로 한 줄을 실제로 고쳐 쓴다 (supabase-setup.sql 7번).
# 실패하면 GitHub가 워크플로 실패 메일을 보내니, 받으면 대시보드에서 프로젝트 상태를 확인한다.
# 공개 저장소는 60일간 커밋이 없으면 GitHub가 예약 워크플로를 꺼 버리므로(메일도 없음),
# 돌 때마다 이 워크플로를 다시 켜서 그 타이머를 되돌린다.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ojettldqwtwxemzfzfvc.supabase.co
      # 사이트 코드(public/assets/js/supabase-client.js)에 이미 공개된 publishable 키
      SUPABASE_KEY: sb_publishable_hYLRjzsadwOrcCqCwXM-5w_zveEtlol
    steps:
      - name: Write keepalive row
        run: |
          # -o 파일로 받으면 재시도할 때 앞선 응답 본문이 덮어써진다 (stdout은 이어 붙음)
          code=$(curl -sS --retry 3 -o resp.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code: $(cat resp.json)"
          test "$code" = "200"

      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
