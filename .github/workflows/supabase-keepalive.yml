name: Supabase keepalive

# 무료 플랜은 7일간 활동이 없으면 프로젝트를 일시정지한다.
# 3일마다 DB를 한 번 조회해 깨워둔다. (RLS 때문에 결과는 빈 배열이지만 DB 쿼리로 집계된다)
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ojettldqwtwxemzfzfvc.supabase.co
      # 사이트 코드(public/assets/js/supabase-client.js)에 이미 공개된 publishable 키
      SUPABASE_KEY: sb_publishable_hYLRjzsadwOrcCqCwXM-5w_zveEtlol
    steps:
      - name: Query profiles
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          test "$code" = "200"
