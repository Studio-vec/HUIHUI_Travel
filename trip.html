<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>코스 상세 — HUIHUI Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    /* ══════════════════════════
       NAVBAR
    ══════════════════════════ */
    .navbar {
      position: sticky; top: 0; z-index: var(--z-fixed);
      background: rgba(255,248,235,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      height: 56px;
      padding: 0 clamp(var(--space-5), 5vw, var(--space-12));
      display: flex; align-items: center; gap: var(--space-6);
    }
    .navbar-back {
      display: inline-flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-heading); font-size: var(--text-sm);
      font-weight: 500; color: var(--color-text-secondary);
      text-decoration: none; letter-spacing: var(--tracking-wide);
      transition: color var(--dur-fast);
      flex-shrink: 0;
    }
    .navbar-back:hover { color: var(--lavender-600); }
    .navbar-logo {
      font-family: var(--font-display); font-size: 20px;
      font-style: italic; font-weight: 600;
      color: var(--lavender-600); text-decoration: none;
      letter-spacing: 0.02em;
    }
    .navbar-links {
      display: flex; list-style: none; gap: var(--space-1);
    }
    .navbar-links a {
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 500;
      color: var(--color-text-secondary); text-decoration: none;
      letter-spacing: var(--tracking-wide);
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
      transition: color var(--dur-fast), background var(--dur-fast);
    }
    .navbar-links a:hover { color: var(--lavender-600); background: var(--lavender-50); }
    @media (max-width: 600px) { .navbar-links { display: none; } }
    .navbar-right {
      margin-left: auto;
      display: flex; align-items: center; gap: var(--space-3);
    }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-heading); font-weight: 500;
      letter-spacing: var(--tracking-wide);
      border: none; cursor: pointer; text-decoration: none;
      transition: background var(--dur-fast), color var(--dur-fast),
                  box-shadow var(--dur-fast), transform var(--dur-fast);
      user-select: none; white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-sm  { font-size: var(--text-xs);  padding: var(--space-2) var(--space-4);  border-radius: var(--radius-full); }
    .btn-md  { font-size: var(--text-sm);  padding: var(--space-3) var(--space-6);  border-radius: var(--radius-full); }
    .btn-primary { background: var(--lavender-300); color: var(--lavender-700); }
    .btn-primary:hover { background: var(--lavender-400); color: #fff; box-shadow: var(--shadow-brand); }
    .btn-ghost  { background: transparent; color: var(--color-text-secondary); }
    .btn-ghost:hover { background: var(--sand-200); color: var(--color-text-primary); }
    .btn-save-active { background: var(--lavender-100); color: var(--lavender-600); border: 1.5px solid var(--lavender-300); }

    /* ══════════════════════════
       COURSE HERO
    ══════════════════════════ */
    .course-hero {
      position: relative;
      width: 100%;
      aspect-ratio: 21/9;
      min-height: 200px; max-height: 420px;
      background: linear-gradient(135deg, var(--lavender-200) 0%, var(--sand-200) 60%, var(--lime-100) 100%);
      overflow: hidden;
    }
    .course-hero-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .course-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(42,31,72,0.72) 0%, rgba(42,31,72,0.15) 55%, transparent 100%);
    }
    .course-hero-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: clamp(var(--space-6), 5vw, var(--space-10))
               clamp(var(--space-5), 6vw, var(--space-16));
      display: flex; flex-direction: column; gap: var(--space-3);
    }
    .course-hero-tags { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .tag {
      display: inline-flex; align-items: center; gap: var(--space-1);
      font-family: var(--font-heading); font-size: var(--text-xs);
      font-weight: 500; letter-spacing: var(--tracking-wide);
      padding: 3px var(--space-3); border-radius: var(--radius-full);
    }
    .tag-glass {
      background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
    }
    .tag-lavender { background: var(--lavender-100); color: var(--lavender-600); }
    .tag-lime     { background: var(--lime-100);     color: var(--lime-600); }
    .tag-sand     { background: var(--sand-200);     color: var(--sand-600); }
    .course-hero-title {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(28px, 6vw, 56px);
      color: #fff; line-height: 1.1;
      letter-spacing: var(--tracking-tight);
      text-shadow: 0 2px 16px rgba(42,31,72,0.3);
    }
    .course-hero-meta {
      display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap;
      font-family: var(--font-heading); font-size: var(--text-xs);
      color: rgba(255,255,255,0.75);
      letter-spacing: var(--tracking-wide);
    }
    .course-hero-meta-dot { width:3px; height:3px; border-radius:50%; background: rgba(255,255,255,0.5); }

    /* ══════════════════════════
       PAGE BODY
    ══════════════════════════ */
    .page-body {
      max-width: 760px; margin: 0 auto;
      padding: var(--space-10) clamp(var(--space-5), 5vw, var(--space-12))
               var(--space-24);
      display: flex; flex-direction: column; gap: var(--space-12);
    }

    /* ══════════════════════════
       OPERATOR NOTE
    ══════════════════════════ */
    .operator-note {
      display: flex; gap: var(--space-4); align-items: flex-start;
      padding: var(--space-6);
      background: var(--lavender-50);
      border-radius: var(--radius-xl);
      border: 1px solid var(--lavender-200);
    }
    .operator-avatar {
      width: 40px; height: 40px; border-radius: var(--radius-full);
      background: var(--lavender-300);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .operator-note-body { flex: 1; display: flex; flex-direction: column; gap: var(--space-2); }
    .operator-note-header { display: flex; align-items: center; gap: var(--space-2); }
    .operator-name {
      font-family: var(--font-heading); font-size: var(--text-sm);
      font-weight: 600; color: var(--color-text-primary);
    }
    .operator-badge {
      font-family: var(--font-heading); font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-wider); text-transform: uppercase;
      color: var(--lavender-600); background: var(--lavender-200);
      padding: 2px var(--space-2); border-radius: var(--radius-full);
    }
    .operator-note-text {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(15px, 2.2vw, 18px);
      color: var(--color-text-secondary); line-height: var(--leading-normal);
      letter-spacing: 0.01em;
    }

    /* ══════════════════════════
       ROUTE STEPS
    ══════════════════════════ */
    .section-title {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 600;
      color: var(--color-text-tertiary); letter-spacing: var(--tracking-widest);
      text-transform: uppercase; margin-bottom: var(--space-4);
    }
    .route-steps {
      display: flex; align-items: center; gap: 0;
      overflow-x: auto; padding-bottom: var(--space-2);
      scrollbar-width: none;
    }
    .route-steps::-webkit-scrollbar { display: none; }
    .route-step { display: flex; align-items: center; flex-shrink: 0; cursor: pointer; }
    .route-step-pill {
      display: flex; flex-direction: column; gap: 2px;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-full);
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      transition: border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast);
    }
    .route-step-pill:hover,
    .route-step.active .route-step-pill {
      border-color: var(--lavender-300);
      background: var(--lavender-50);
      box-shadow: var(--shadow-brand);
    }
    .route-step-num {
      font-family: var(--font-heading); font-size: 9px; font-weight: 600;
      color: var(--color-text-tertiary); letter-spacing: var(--tracking-widest);
      text-align: center;
    }
    .route-step.active .route-step-num { color: var(--lavender-500); }
    .route-step-name {
      font-family: var(--font-body); font-size: var(--text-sm); font-weight: 500;
      color: var(--color-text-primary); white-space: nowrap;
    }
    .route-arrow {
      width: 32px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-border);
    }

    /* ══════════════════════════
       PLACE PANELS
    ══════════════════════════ */
    .places { display: flex; flex-direction: column; gap: var(--space-4); }
    .place-panel {
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-xl);
      background: var(--color-surface);
      overflow: hidden;
      transition: border-color var(--dur-base), box-shadow var(--dur-base);
    }
    .place-panel.open { border-color: var(--lavender-200); box-shadow: var(--shadow-md); }
    .place-header {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-5) var(--space-6);
      cursor: pointer; user-select: none;
      transition: background var(--dur-fast);
    }
    .place-header:hover { background: var(--sand-50); }
    .place-num {
      font-family: var(--font-display); font-style: italic;
      font-size: var(--text-2xl); font-weight: 300;
      color: var(--lavender-300); min-width: 36px; line-height: 1;
    }
    .place-header-body { flex: 1; display: flex; flex-direction: column; gap: var(--space-2); }
    .place-name-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .place-name {
      font-family: var(--font-heading); font-size: var(--text-lg); font-weight: 600;
      color: var(--color-text-primary);
    }
    .place-desc-preview {
      font-size: var(--text-sm); color: var(--color-text-tertiary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 340px;
    }
    .place-header-right { display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0; }
    .tip-count-badge {
      display: inline-flex; align-items: center; gap: var(--space-1);
      font-family: var(--font-heading); font-size: var(--text-xs);
      font-weight: 500; color: var(--lavender-600);
      background: var(--lavender-100); padding: 3px var(--space-3);
      border-radius: var(--radius-full);
    }
    .chevron {
      color: var(--color-text-tertiary);
      transition: transform var(--dur-base) var(--ease-out);
    }
    .place-panel.open .chevron { transform: rotate(180deg); }
    .place-body {
      display: none;
      padding: 0 var(--space-6) var(--space-6);
      flex-direction: column; gap: var(--space-6);
    }
    .place-panel.open .place-body { display: flex; }
    .place-divider { height: 1px; background: var(--color-border); margin-bottom: var(--space-2); }

    /* photo strip */
    .photo-strip {
      display: flex; gap: var(--space-3);
      overflow-x: auto; padding-bottom: var(--space-1);
      scrollbar-width: none;
    }
    .photo-strip::-webkit-scrollbar { display: none; }
    .photo-thumb {
      width: 120px; height: 88px; flex-shrink: 0;
      border-radius: var(--radius-md);
      background: var(--lavender-100); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-style: italic;
      font-size: var(--text-sm); color: var(--lavender-300);
    }
    .photo-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .place-description {
      font-size: var(--text-sm); color: var(--color-text-secondary);
      line-height: var(--leading-loose);
    }

    /* ══════════════════════════
       TIPS SECTION
    ══════════════════════════ */
    .tips-section { display: flex; flex-direction: column; gap: var(--space-4); }
    .tips-header-row { display: flex; align-items: center; justify-content: space-between; }
    .tips-title {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 600;
      color: var(--color-text-tertiary); letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
    }
    .card-tip {
      background: var(--sand-50); border: 1px solid var(--sand-200);
      border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5);
      display: flex; flex-direction: column; gap: var(--space-3);
    }
    .card-tip.operator { border-color: var(--lavender-200); background: var(--lavender-50); }
    .tip-header { display: flex; align-items: center; gap: var(--space-3); }
    .tip-avatar {
      width: 30px; height: 30px; border-radius: var(--radius-full);
      background: var(--lavender-200); display: flex; align-items: center;
      justify-content: center; font-size: 13px; flex-shrink: 0;
    }
    .card-tip.operator .tip-avatar { background: var(--lavender-300); }
    .tip-author-wrap { flex: 1; display: flex; align-items: center; gap: var(--space-2); }
    .tip-author {
      font-family: var(--font-heading); font-size: var(--text-sm);
      font-weight: 600; color: var(--color-text-primary);
    }
    .tip-date { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-tertiary); }
    .tip-body { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-normal); }
    .tip-footer { display: flex; align-items: center; gap: var(--space-4); }
    .tip-upvote {
      display: inline-flex; align-items: center; gap: var(--space-1);
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 500;
      color: var(--color-text-tertiary);
      background: none; border: none; cursor: pointer;
      padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
      transition: color var(--dur-fast), background var(--dur-fast);
    }
    .tip-upvote:hover { background: var(--lavender-100); color: var(--lavender-600); }
    .tip-upvote.active { color: var(--lavender-600); background: var(--lavender-100); }
    .tips-empty {
      padding: var(--space-6); text-align: center;
      background: var(--sand-50); border-radius: var(--radius-lg);
      border: 1.5px dashed var(--sand-300);
    }
    .tips-empty-text { font-size: var(--text-sm); color: var(--color-text-tertiary); line-height: var(--leading-snug); }
    .tips-empty-cta {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 500;
      color: var(--lavender-500); margin-top: var(--space-2);
      cursor: pointer; letter-spacing: var(--tracking-wide);
    }
    .tips-empty-cta:hover { text-decoration: underline; }

    /* ══════════════════════════
       DAY GROUPS
    ══════════════════════════ */
    .itinerary { display: flex; flex-direction: column; gap: var(--space-8); }

    .day-group { display: flex; flex-direction: column; gap: var(--space-4); }

    .day-header {
      display: flex; align-items: center; gap: var(--space-3);
    }
    .day-label {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 700;
      letter-spacing: var(--tracking-widest); text-transform: uppercase;
      color: var(--lavender-600); background: var(--lavender-100);
      padding: var(--space-2) var(--space-4); border-radius: var(--radius-full);
      white-space: nowrap; flex-shrink: 0;
    }
    .day-divider { flex: 1; height: 1px; background: var(--color-border); }

    .day-places {
      position: relative;
      display: flex; flex-direction: column; gap: var(--space-3);
      padding-left: var(--space-5);
    }
    .day-places::before {
      content: '';
      position: absolute; left: 0; top: 20px; bottom: 20px;
      width: 2px;
      background: linear-gradient(to bottom, var(--lavender-300), var(--lavender-100));
      border-radius: 2px;
    }

    /* ══════════════════════════
       LOADING / ERROR
    ══════════════════════════ */
    .page-loading {
      min-height: 60vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: var(--space-4);
    }
    .loading-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--lavender-200);
      border-top-color: var(--lavender-500);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: var(--font-heading); font-size: var(--text-sm);
      color: var(--color-text-tertiary); letter-spacing: var(--tracking-wide);
    }
    .page-error {
      min-height: 60vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: var(--space-4); text-align: center;
      padding: var(--space-10);
    }
    .error-emoji { font-size: 40px; }
    .error-title {
      font-family: var(--font-display); font-style: italic;
      font-size: var(--text-2xl); color: var(--color-text-primary);
    }
    .error-desc { font-size: var(--text-sm); color: var(--color-text-secondary); }

    /* ══════════════════════════
       SAVE FAB
    ══════════════════════════ */
    .save-fab {
      position: fixed;
      bottom: clamp(var(--space-6), 4vw, var(--space-10));
      right: clamp(var(--space-6), 4vw, var(--space-10));
      z-index: var(--z-overlay);
      display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-3);
    }
    .save-fab-hint {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 500;
      color: var(--lavender-600); background: #fff;
      border: 1px solid var(--lavender-200);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-md);
      display: none; white-space: nowrap;
    }
    .save-fab-btn {
      width: 52px; height: 52px; border-radius: var(--radius-full);
      background: var(--lavender-300); color: var(--lavender-700);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-brand);
      transition: background var(--dur-fast), transform var(--dur-base), box-shadow var(--dur-fast);
    }
    .save-fab-btn:hover { background: var(--lavender-400); color: #fff; transform: scale(1.08); }
    .save-fab-btn.saved { background: var(--lime-300); color: var(--lime-600); box-shadow: var(--shadow-lime); }
    .save-fab-btn.saved:hover { background: var(--lime-400); }

    /* ══════════════════════════
       MODALS
    ══════════════════════════ */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(42,31,72,0.45);
      backdrop-filter: blur(4px);
      z-index: var(--z-modal);
      align-items: center; justify-content: center;
      padding: var(--space-5);
    }
    .modal-overlay.show { display: flex; }
    .modal-card {
      background: var(--color-surface);
      border-radius: var(--radius-2xl);
      padding: var(--space-10) var(--space-8) var(--space-8);
      width: 100%; max-width: 400px;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.22s var(--ease-out);
      display: flex; flex-direction: column; gap: var(--space-6);
    }
    @keyframes slideUp {
      from { transform: translateY(18px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-title {
      font-family: var(--font-display); font-style: italic;
      font-size: var(--text-2xl); color: var(--color-text-primary);
      letter-spacing: var(--tracking-tight);
    }
    .modal-subtitle { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-snug); margin-top: var(--space-2); }
    .modal-actions { display: flex; gap: var(--space-3); flex-direction: column; }
    .modal-footer-text { text-align: center; font-size: var(--text-sm); color: var(--color-text-tertiary); }
    .modal-footer-text a { color: var(--lavender-500); text-decoration: none; font-weight: 500; }
    .modal-footer-text a:hover { text-decoration: underline; }

    /* form */
    .form-group { display: flex; flex-direction: column; gap: var(--space-2); }
    .form-label {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 600;
      color: var(--color-text-secondary); letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
    }
    .form-input, .form-textarea {
      font-family: var(--font-body); font-size: var(--text-sm);
      color: var(--color-text-primary);
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4); width: 100%; outline: none;
      transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
    }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--color-text-tertiary); }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--lavender-300);
      box-shadow: 0 0 0 3px rgba(192,168,255,0.20);
    }
    .form-textarea { resize: vertical; min-height: 96px; }
    .char-count { font-size: var(--text-xs); color: var(--color-text-tertiary); text-align: right; margin-top: var(--space-1); }
    .char-count.warn { color: var(--color-warning); }

    /* season chips */
    .season-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .season-chip {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 500;
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
      border: 1.5px solid var(--color-border); background: none;
      cursor: pointer; letter-spacing: var(--tracking-wide);
      color: var(--color-text-secondary);
      transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast);
    }
    .season-chip:hover  { border-color: var(--lavender-300); color: var(--lavender-600); }
    .season-chip.active { border-color: var(--lavender-300); background: var(--lavender-100); color: var(--lavender-600); }

    /* kakao btn */
    .btn-kakao {
      background: #FEE500; color: #191919; border: none;
      display: flex; align-items: center; justify-content: center; gap: var(--space-3);
      padding: var(--space-3) var(--space-6); border-radius: var(--radius-full);
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 600;
      cursor: pointer; width: 100%;
      transition: filter var(--dur-fast);
    }
    .btn-kakao:hover { filter: brightness(0.95); }

    /* toast */
    .save-toast {
      position: fixed;
      bottom: clamp(var(--space-8), 8vw, var(--space-14));
      left: 50%; transform: translateX(-50%);
      z-index: var(--z-toast);
      display: inline-flex; align-items: center; gap: var(--space-3);
      background: var(--color-text-primary); color: #fff;
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 500;
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg);
      white-space: nowrap;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .save-toast.show { opacity: 1; }

    .or-divider {
      display: flex; align-items: center; gap: var(--space-4);
      font-family: var(--font-heading); font-size: var(--text-xs);
      color: var(--color-text-tertiary); letter-spacing: var(--tracking-widest);
    }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
  </style>
</head>
<body>

  <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <a href="index.html" class="navbar-back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      코스 목록
    </a>
    <a href="index.html" class="navbar-logo">HUIHUI Travel</a>
    <ul class="navbar-links">
      <li><a href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a></li>
      <li><a href="gallery.html">갤러리</a></li>
      <li><a href="game.html">게임</a></li>
    </ul>
    <div class="navbar-right">
      <button class="btn btn-ghost btn-sm" id="navLoginBtn" onclick="showLoginModal()">로그인</button>
      <button class="btn btn-primary btn-sm" id="navSaveBtn" onclick="toggleSave()">저장하기</button>
    </div>
  </nav>

  <!-- ── DYNAMIC CONTENT ── -->
  <div id="pageContent">
    <div class="page-loading">
      <div class="loading-spinner"></div>
      <span class="loading-text">코스 불러오는 중...</span>
    </div>
  </div>

  <!-- ── 저장 FAB ── -->
  <div class="save-fab">
    <div class="save-fab-hint" id="fabHint">저장 완료!</div>
    <button class="save-fab-btn" id="saveFabBtn" onclick="toggleSave()" aria-label="코스 저장">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path id="heartPath" d="M12 21l-9-9a5 5 0 017-7l2 2 2-2a5 5 0 017 7l-9 9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- ── 팁 작성 모달 ── -->
  <div class="modal-overlay" id="tipModal" onclick="closeTipModalOnBg(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div>
        <div class="modal-title">팁 남기기</div>
        <div class="modal-subtitle" id="tipModalPlaceName">이 장소에서 발견한 정보를 공유해주세요</div>
      </div>
      <div class="form-group">
        <label class="form-label">팁 내용 <span style="color:var(--color-error)">*</span></label>
        <textarea class="form-textarea" id="tipTextarea"
          placeholder="방문 시간, 주차, 웨이팅, 숨은 명소 등 실용적인 정보라면 뭐든 좋아요!"
          maxlength="200" oninput="updateCharCount()"></textarea>
        <div class="char-count" id="charCount">0 / 200</div>
      </div>
      <div class="form-group">
        <label class="form-label">방문 계절</label>
        <div class="season-chips">
          <button class="season-chip" onclick="toggleSeason(this)">🌸 봄</button>
          <button class="season-chip" onclick="toggleSeason(this)">🌿 여름</button>
          <button class="season-chip" onclick="toggleSeason(this)">🍂 가을</button>
          <button class="season-chip" onclick="toggleSeason(this)">❄️ 겨울</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary btn-md" style="width:100%" onclick="submitTip()">팁 등록하기</button>
        <button class="btn btn-ghost btn-md" style="width:100%" onclick="closeTipModal()">취소</button>
      </div>
    </div>
  </div>

  <!-- ── 로그인 모달 ── -->
  <div class="modal-overlay" id="loginModal" onclick="closeLoginModalOnBg(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div>
        <div class="modal-title">다시 만나서 반가워요</div>
        <div class="modal-subtitle">로그인하고 여행 팁을 공유해보세요</div>
      </div>
      <div class="modal-actions">
        <button class="btn-kakao" onclick="mockLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 3C7.03 3 3 6.36 3 10.5c0 2.67 1.73 5.01 4.33 6.37l-.9 3.35 3.9-2.57A10.7 10.7 0 0012 18c4.97 0 9-3.36 9-7.5S16.97 3 12 3z" fill="#191919"/>
          </svg>
          카카오로 계속하기
        </button>
        <div class="or-divider">또는</div>
        <div class="form-group">
          <input class="form-input" type="email" placeholder="이메일"/>
        </div>
        <div class="form-group">
          <input class="form-input" type="password" placeholder="비밀번호"/>
        </div>
        <button class="btn btn-primary btn-md" style="width:100%" onclick="mockLogin()">로그인</button>
      </div>
      <div class="modal-footer-text">
        계정이 없으신가요? <a href="#" onclick="mockLogin()">회원가입</a>
      </div>
    </div>
  </div>

  <!-- ── 저장 Toast ── -->
  <div class="save-toast" id="saveToast">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
      <path d="M3 8l4 4 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="saveToastMsg">코스가 저장되었어요</span>
  </div>

  <script>
  /* ═══════════════════════════════════════════
     LOAD DATA
  ═══════════════════════════════════════════ */
  let COURSE = null;
  let isSaved    = false;
  let isLoggedIn = false;
  let currentPlaceId = null;
  let selectedSeason = '';
  let _pendingPlaceId = null;

  const params = new URLSearchParams(location.search);
  const courseId = params.get('id');

  async function loadCourse() {
    if (!courseId) { showError('코스 ID가 없어요', 'URL에 ?id=yeosu 형식으로 코스를 지정해주세요.'); return; }
    try {
      const res = await fetch('trips/data/' + courseId + '.json');
      if (!res.ok) throw new Error('not found');
      COURSE = await res.json();
      // add upvoted state (not in JSON)
      COURSE.places.forEach(p => p.tips.forEach(t => { t.upvoted = false; }));
      document.title = COURSE.title + ' — HUIHUI Travel';
      renderPage();
    } catch(e) {
      showError('코스를 찾을 수 없어요', '"' + courseId + '" 코스가 아직 준비 중이에요.');
    }
  }

  function showError(title, desc) {
    document.getElementById('pageContent').innerHTML = `
      <div class="page-error">
        <div class="error-emoji">✈️</div>
        <div class="error-title">${title}</div>
        <p class="error-desc">${desc}</p>
        <a href="index.html" class="btn btn-primary btn-md" style="margin-top:16px">홈으로 돌아가기</a>
      </div>`;
  }

  /* ═══════════════════════════════════════════
     RENDER PAGE
  ═══════════════════════════════════════════ */
  function renderPage() {
    const tagsHTML = COURSE.tags.map(t =>
      `<span class="tag tag-glass">${t}</span>`
    ).join('');

    const metaHTML = COURSE.meta.map((m, i) =>
      (i === 0 ? '' : '<span class="course-hero-meta-dot"></span>') + `<span>${m}</span>`
    ).join('');

    document.getElementById('pageContent').innerHTML = `
      <section class="course-hero">
        <div class="course-hero-overlay"></div>
        <div class="course-hero-content">
          <div class="course-hero-tags">${tagsHTML}</div>
          <h1 class="course-hero-title">${COURSE.title}</h1>
          <div class="course-hero-meta">${metaHTML}</div>
        </div>
      </section>
      <main class="page-body">
        <div>
          <p class="section-title">코스 순서</p>
          <div class="route-steps" id="routeSteps"></div>
        </div>
        <div class="itinerary" id="placesList"></div>
      </main>`;

    renderRouteSteps();
    renderPlaces();
    document.querySelector('.place-panel')?.classList.add('open');
  }

  /* ═══════════════════════════════════════════
     RENDER HELPERS
  ═══════════════════════════════════════════ */
  function renderRouteSteps() {
    const el = document.getElementById('routeSteps');
    el.innerHTML = COURSE.places.map((p, i) => `
      <div class="route-step" data-place-id="${p.id}" onclick="scrollToPlace('${p.id}')">
        <div class="route-step-pill">
          <span class="route-step-num">${p.no}</span>
          <span class="route-step-name">${p.name}</span>
        </div>
      </div>
      ${i < COURSE.places.length - 1
        ? `<div class="route-arrow"><svg width="16" height="16" viewBox="0 0 16 16" fill="none">
             <path d="M4 8h8M9 5l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
           </svg></div>`
        : ''}
    `).join('');
  }

  function scrollToPlace(placeId) {
    const el = document.getElementById('panel-' + placeId);
    if (!el) return;
    el.scrollIntoView({ behavior:'smooth', block:'start' });
    if (!el.classList.contains('open')) togglePanel(el);
  }

  function renderPlaces() {
    const el = document.getElementById('placesList');

    // group by day
    const dayMap = {};
    COURSE.places.forEach(p => {
      const d = p.day || 1;
      if (!dayMap[d]) dayMap[d] = [];
      dayMap[d].push(p);
    });

    el.innerHTML = Object.entries(dayMap).map(([day, places]) => `
      <div class="day-group">
        <div class="day-header">
          <span class="day-label">${day}일차</span>
          <span class="day-divider"></span>
        </div>
        <div class="day-places">
          ${places.map(p => renderPlacePanel(p)).join('')}
        </div>
      </div>
    `).join('');
  }

  function renderPlacePanel(p) {
    const tagsHTML = p.tags.map(t =>
      `<span class="tag ${t.style}">${t.label}</span>`
    ).join('');

    const photosHTML = p.photos.map(label =>
      `<div class="photo-thumb">${label}</div>`
    ).join('');

    const visibleTips = p.tips.filter(t => !t.isOperator);
    const tipCount = visibleTips.length;
    const tipsHTML = tipCount === 0
      ? `<div class="tips-empty">
           <p class="tips-empty-text">아직 팁이 없어요<br>첫 번째 팁을 남겨보세요!</p>
           <p class="tips-empty-cta" onclick="openTipModal('${p.id}')">+ 팁 남기기</p>
         </div>`
      : visibleTips.map(t => renderTipCard(t, p.id)).join('');

    return `
    <div class="place-panel" id="panel-${p.id}">
      <div class="place-header" onclick="togglePanel(this.parentElement)">
        <span class="place-num">${p.no}</span>
        <div class="place-header-body">
          <div class="place-name-row">
            <span class="place-name">${p.name}</span>
            ${tagsHTML}
          </div>
          <span class="place-desc-preview">${p.desc.slice(0, 45)}...</span>
        </div>
        <div class="place-header-right">
          ${tipCount > 0 ? `<span class="tip-count-badge">
            <svg width="11" height="11" viewBox="0 0 14 14" fill="none">
              <path d="M2 2h10a1 1 0 011 1v6a1 1 0 01-1 1H8l-2 2v-2H2a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/>
            </svg>
            팁 ${tipCount}
          </span>` : ''}
          <svg class="chevron" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M4.5 6.75l4.5 4.5 4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="place-body">
        <div class="place-divider"></div>
        <div class="photo-strip">${photosHTML}</div>
        <p class="place-description">${p.desc}</p>
        <div class="tips-section">
          <div class="tips-header-row">
            <span class="tips-title">여행자 팁</span>
            <button class="btn btn-ghost btn-sm" onclick="openTipModal('${p.id}')">
              <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
                <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              팁 남기기
            </button>
          </div>
          <div class="tips-list" id="tips-${p.id}">${tipsHTML}</div>
        </div>
      </div>
    </div>`;
  }

  function renderTipCard(t, placeId) {
    return `
    <div class="card-tip ${t.isOperator ? 'operator' : ''}" id="tip-${t.id}">
      <div class="tip-header">
        <div class="tip-avatar">${t.avatar}</div>
        <div class="tip-author-wrap">
          <span class="tip-author">${t.author}</span>
          ${t.isOperator ? `<span class="operator-badge">운영자</span>` : ''}
        </div>
        <span class="tip-date">${t.date}</span>
      </div>
      <p class="tip-body">${t.body}</p>
      <div class="tip-footer">
        ${t.season ? `<span class="tag tag-lime">${t.season}</span>` : ''}
        <button class="tip-upvote ${t.upvoted ? 'active' : ''}"
          onclick="toggleUpvote('${t.id}', '${placeId}')">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <path d="M7 12L2 7a3.5 3.5 0 014.9-4.9L7 3.1l.1-.1A3.5 3.5 0 0112 7l-5 5z"
              ${t.upvoted ? 'fill="currentColor"' : 'stroke="currentColor" stroke-width="1.4"'}/>
          </svg>
          <span id="upvote-count-${t.id}">${t.upvotes}</span>
        </button>
      </div>
    </div>`;
  }

  /* ═══════════════════════════════════════════
     INTERACTIONS
  ═══════════════════════════════════════════ */
  function togglePanel(panel) { panel.classList.toggle('open'); }

  function toggleUpvote(tipId, placeId) {
    const place = COURSE.places.find(p => p.id === placeId);
    const tip   = place?.tips.find(t => t.id === tipId);
    if (!tip) return;
    tip.upvoted = !tip.upvoted;
    tip.upvotes += tip.upvoted ? 1 : -1;
    const countEl = document.getElementById('upvote-count-' + tipId);
    const btn = countEl?.closest('.tip-upvote');
    if (countEl) countEl.textContent = tip.upvotes;
    if (btn) {
      btn.classList.toggle('active', tip.upvoted);
      const path = btn.querySelector('path');
      if (path) {
        if (tip.upvoted) { path.setAttribute('fill','currentColor'); path.removeAttribute('stroke'); path.removeAttribute('stroke-width'); }
        else { path.removeAttribute('fill'); path.setAttribute('stroke','currentColor'); path.setAttribute('stroke-width','1.4'); }
      }
    }
  }

  function toggleSave() {
    isSaved = !isSaved;
    const fab   = document.getElementById('saveFabBtn');
    const hint  = document.getElementById('fabHint');
    const heart = document.getElementById('heartPath');
    fab.classList.toggle('saved', isSaved);
    if (isSaved) {
      heart.setAttribute('fill','currentColor');
      hint.style.display = 'block';
      showSaveToast('코스가 저장되었어요 ✓');
      setTimeout(() => { hint.style.display = 'none'; }, 2000);
    } else {
      heart.removeAttribute('fill');
      showSaveToast('저장이 취소되었어요');
    }
    const navSave = document.getElementById('navSaveBtn');
    navSave.textContent = isSaved ? '저장됨' : '저장하기';
    navSave.className   = isSaved ? 'btn btn-save-active btn-sm' : 'btn btn-primary btn-sm';
  }

  function openTipModal(placeId) {
    if (!isLoggedIn) { showLoginModal(placeId); return; }
    currentPlaceId = placeId;
    const place = COURSE.places.find(p => p.id === placeId);
    document.getElementById('tipModalPlaceName').textContent =
      place ? `"${place.name}"에서 발견한 정보를 공유해주세요` : '';
    document.getElementById('tipTextarea').value = '';
    updateCharCount();
    document.querySelectorAll('.season-chip').forEach(c => c.classList.remove('active'));
    selectedSeason = '';
    document.getElementById('tipModal').classList.add('show');
  }
  function closeTipModal() { document.getElementById('tipModal').classList.remove('show'); }
  function closeTipModalOnBg(e) { if(e.target === e.currentTarget) closeTipModal(); }

  function updateCharCount() {
    const len = document.getElementById('tipTextarea').value.length;
    const el  = document.getElementById('charCount');
    el.textContent = len + ' / 200';
    el.className = 'char-count' + (len > 180 ? ' warn' : '');
  }

  function toggleSeason(btn) {
    const isActive = btn.classList.contains('active');
    document.querySelectorAll('.season-chip').forEach(c => c.classList.remove('active'));
    if (!isActive) { btn.classList.add('active'); selectedSeason = btn.textContent.trim(); }
    else selectedSeason = '';
  }

  function submitTip() {
    const body = document.getElementById('tipTextarea').value.trim();
    if (!body) { document.getElementById('tipTextarea').focus(); return; }
    const place = COURSE.places.find(p => p.id === currentPlaceId);
    if (!place) return;

    const newTip = {
      id: 'tip-new-' + Date.now(),
      author: '나', avatar: '✈️', isOperator: false,
      date: new Date().toLocaleDateString('ko-KR',{ year:'numeric', month:'2-digit' }).replace(/\. /g,'.').replace('.',''),
      body, season: selectedSeason,
      upvotes: 0, upvoted: false,
    };
    place.tips.push(newTip);

    const listEl = document.getElementById('tips-' + currentPlaceId);
    if (listEl) {
      const empty = listEl.querySelector('.tips-empty');
      if (empty) listEl.innerHTML = '';
      listEl.insertAdjacentHTML('beforeend', renderTipCard(newTip, currentPlaceId));
    }
    refreshTipBadge(currentPlaceId);
    closeTipModal();
    showSaveToast('팁이 등록되었어요 🎉');
  }

  function refreshTipBadge(placeId) {
    const place = COURSE.places.find(p => p.id === placeId);
    if (!place) return;
    const panel  = document.getElementById('panel-' + placeId);
    const right  = panel?.querySelector('.place-header-right');
    if (!right) return;
    const existing = right.querySelector('.tip-count-badge');
    const newBadge = `<span class="tip-count-badge">
      <svg width="11" height="11" viewBox="0 0 14 14" fill="none">
        <path d="M2 2h10a1 1 0 011 1v6a1 1 0 01-1 1H8l-2 2v-2H2a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      팁 ${place.tips.length}
    </span>`;
    if (existing) existing.outerHTML = newBadge;
    else right.insertAdjacentHTML('afterbegin', newBadge);
  }

  function showLoginModal(placeId) {
    _pendingPlaceId = placeId || null;
    document.getElementById('loginModal').classList.add('show');
  }
  function closeLoginModal() { document.getElementById('loginModal').classList.remove('show'); }
  function closeLoginModalOnBg(e) { if(e.target === e.currentTarget) closeLoginModal(); }

  function mockLogin() {
    isLoggedIn = true;
    const btn = document.getElementById('navLoginBtn');
    btn.textContent = '안녕하세요 👋';
    btn.onclick = null;
    closeLoginModal();
    showSaveToast('환영해요! 이제 팁을 남길 수 있어요 ✓');
    if (_pendingPlaceId) {
      setTimeout(() => openTipModal(_pendingPlaceId), 300);
      _pendingPlaceId = null;
    }
  }

  let _toastTimer = null;
  function showSaveToast(msg) {
    const el = document.getElementById('saveToast');
    document.getElementById('saveToastMsg').textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ═══════════════════════════════════════════

  loadCourse();
