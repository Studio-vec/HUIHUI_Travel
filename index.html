<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HUIHUI Travel — 국내 여행 안내서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ══════════════════════════════
       NAVBAR
    ══════════════════════════════ */
    .navbar {
      position: sticky; top: 0; z-index: var(--z-fixed);
      background: rgba(255, 248, 235, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      padding: 0 clamp(var(--space-5), 5vw, var(--space-12));
      height: 56px;
      display: flex; align-items: center; gap: var(--space-8);
    }
    .navbar-logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-style: italic;
      font-weight: 600;
      color: var(--lavender-600);
      letter-spacing: 0.02em;
      text-decoration: none;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .navbar-links {
      display: flex; gap: var(--space-6);
      list-style: none;
      flex: 1;
    }
    .navbar-links a {
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text-secondary);
      text-decoration: none;
      letter-spacing: var(--tracking-wide);
      transition: color var(--dur-fast) var(--ease-out);
      white-space: nowrap;
    }
    .navbar-links a:hover { color: var(--lavender-600); }
    .navbar-right {
      display: flex; align-items: center; gap: var(--space-3);
      margin-left: auto; flex-shrink: 0;
    }
    /* lang button */
    .lang-btn {
      display: inline-flex; align-items: center; gap: var(--space-1);
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--color-text-secondary);
      background: none;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: var(--space-1) var(--space-3);
      cursor: pointer;
      letter-spacing: var(--tracking-wide);
      transition: border-color var(--dur-fast), color var(--dur-fast), background var(--dur-fast);
    }
    .lang-btn:hover {
      border-color: var(--lavender-300);
      color: var(--lavender-600);
      background: var(--lavender-50);
    }

    /* ══════════════════════════════
       HERO
    ══════════════════════════════ */
    .hero {
      position: relative;
      padding: clamp(var(--space-12), 8vw, var(--space-20))
               clamp(var(--space-5), 5vw, var(--space-12))
               clamp(var(--space-10), 6vw, var(--space-16));
      overflow: hidden;
    }
    /* subtle radial glow */
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -80px;
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(192,168,255,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px; left: -60px;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(180,224,104,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-inner {
      position: relative; z-index: 1;
      max-width: 1148px; margin: 0 auto;
      display: flex; flex-direction: column; gap: var(--space-5);
    }
    .hero-eyebrow {
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--lavender-500);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
    }
    .hero-title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(36px, 7vw, 72px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--color-text-primary);
    }
    .hero-title em {
      font-style: italic;
      color: var(--lavender-500);
    }
    .hero-desc {
      font-family: var(--font-body);
      font-size: clamp(var(--text-sm), 2vw, var(--text-base));
      color: var(--color-text-secondary);
      line-height: var(--leading-normal);
      max-width: 480px;
    }
    .hero-meta {
      display: flex; align-items: center; gap: var(--space-6);
      flex-wrap: wrap;
      margin-top: var(--space-2);
    }
    /* checkout pill */
    .checkout-pill {
      display: inline-flex; align-items: center; gap: var(--space-3);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      padding: var(--space-2) var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .checkout-pill-dot {
      width: 8px; height: 8px;
      border-radius: var(--radius-full);
      background: var(--lime-300);
      flex-shrink: 0;
    }
    .checkout-pill-text {
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--color-text-secondary);
      letter-spacing: var(--tracking-wide);
      white-space: nowrap;
    }
    /* progress track */
    .checkout-track {
      flex: 1; min-width: 120px; max-width: 200px;
      height: 4px;
      background: var(--sand-200);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .checkout-fill {
      height: 100%;
      background: linear-gradient(to right, var(--lavender-300), var(--lime-300));
      border-radius: var(--radius-full);
      transition: width var(--dur-slower) var(--ease-out);
    }

    /* ══════════════════════════════
       SECTION LABEL
    ══════════════════════════════ */
    .section-label {
      max-width: 1148px; margin: 0 auto;
      padding: 0 clamp(var(--space-5), 5vw, var(--space-12));
      display: flex; align-items: center; gap: var(--space-4);
      margin-bottom: var(--space-6);
    }
    .section-label-text {
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-text-tertiary);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .section-label-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--color-border), transparent);
    }

    /* ══════════════════════════════
       KEY GRID
    ══════════════════════════════ */
    .grid-section {
      padding: 0 clamp(var(--space-5), 5vw, var(--space-12))
               clamp(var(--space-16), 14vw, var(--space-24));
    }
    .key-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(var(--space-3), 1.5vw, var(--space-5));
      max-width: 1148px;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .key-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 860px) {
      .key-grid { grid-template-columns: repeat(5, 1fr); }
    }

    /* ── Key Card ── */
    .key-card {
      position: relative; cursor: pointer;
      transition: transform var(--dur-base) var(--ease-out),
                  filter var(--dur-base) var(--ease-out);
      border-radius: var(--radius-lg);
    }
    .key-card:hover { transform: translateY(-3px); filter: brightness(1.04); }
    .key-card.coming-soon { cursor: pointer; }
    .key-card.reserved,
    .key-card.not-visited { cursor: default; }
    .key-card.coming-soon:hover,
    .key-card.reserved:hover,
    .key-card.not-visited:hover { transform: none; filter: none; }
    .key-card.reserved .card-key-img { align-items: flex-end; overflow: visible; bottom: 2%; }

    .card-3d {
      position: relative; width: 100%;
      padding-bottom: 138%;
    }
    .card-slot-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
    .card-name {
      position: absolute;
      top: 3%; left: 8%; right: 8%;
      z-index: 3;
    }
    .card-name-img { display: block; width: 100%; height: auto; }
    .card-name span {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(14px, 3vw, 22px);
      font-weight: 400;
      color: var(--lavender-700);
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .card-name.coming-soon span {
      font-family: var(--font-heading);
      font-size: clamp(9px, 1.8vw, 13px);
      font-weight: 400;
      color: var(--color-text-tertiary);
      letter-spacing: var(--tracking-wider);
    }
    .card-key-img {
      position: absolute;
      top: 20%; left: 12%; right: 12%; bottom: 14%;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }
    .key-card .card-key-img img {
      height: 110%; width: auto; max-width: 110%; object-fit: contain;
    }
    .card-key-img > * { transform-origin: center top; }
    .key-card:not(.coming-soon):not(.reserved):hover .card-key-img > * {
      animation: keySwing 1.2s ease-in-out infinite;
    }

    /* ── hold ring ── */
    @keyframes holdRing {
      0%   { box-shadow: inset 0 0 0 0px rgba(192,168,255,0); }
      100% { box-shadow: inset 0 0 0 10px rgba(192,168,255,0.22); }
    }
    .key-card.pressing { animation: holdRing 0.6s ease-out forwards; }

    @keyframes keySwing {
      0%   { transform: rotate(0deg); }
      15%  { transform: rotate(18deg); }
      35%  { transform: rotate(-15deg); }
      55%  { transform: rotate(10deg); }
      70%  { transform: rotate(-7deg); }
      82%  { transform: rotate(4deg); }
      91%  { transform: rotate(-2deg); }
      100% { transform: rotate(0deg); }
    }

    /* ══════════════════════════════
       BELL
    ══════════════════════════════ */
    .bell-wrapper {
      position: fixed;
      bottom: clamp(var(--space-8), 8vw, var(--space-16));
      right: clamp(var(--space-5), 3.5vw, var(--space-10));
      z-index: var(--z-overlay);
      cursor: pointer;
      width: clamp(56px, 9vw, 84px);
      height: clamp(56px, 9vw, 84px);
      user-select: none;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 16px rgba(107, 79, 180, 0.18), 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
    }
    .bell-wrapper:hover {
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 6px 24px rgba(107, 79, 180, 0.28), 0 2px 8px rgba(0,0,0,0.10);
    }
    .bell-inner {
      width: 62%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .bell-top { position: relative; z-index: 2; transform-origin: center bottom; }
    .bell-top.ringing { animation: bellRingTop 0.45s ease; }
    .bell-bottom { position: relative; z-index: 1; margin-top: -4%; }
    .bell-img { width: 100%; height: auto; display: block; }
    .bell-img-down { margin-top: -6%; }

    @keyframes bellRingTop {
      0%   { transform: rotate(0deg) translateY(0); }
      20%  { transform: rotate(14deg) translateY(-4px); }
      40%  { transform: rotate(-11deg) translateY(-2px); }
      60%  { transform: rotate(8deg) translateY(-3px); }
      80%  { transform: rotate(-5deg) translateY(-1px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    .footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-8) clamp(var(--space-5), 5vw, var(--space-12));
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
    }
    .footer-brand {
      font-family: var(--font-display);
      font-style: italic;
      font-size: var(--text-lg);
      color: var(--lavender-500);
      letter-spacing: var(--tracking-wide);
    }
    .footer-tagline {
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      letter-spacing: var(--tracking-wider);
      text-transform: uppercase;
    }
    .footer-right {
      display: flex; gap: var(--space-5); align-items: center;
    }
    .footer-link {
      font-family: var(--font-heading);
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      text-decoration: none;
      letter-spacing: var(--tracking-wide);
      transition: color var(--dur-fast);
    }
    .footer-link:hover { color: var(--lavender-500); }

    /* ══════════════════════════════
       COMING SOON POPUP
    ══════════════════════════════ */
    .cs-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(42, 31, 72, 0.40);
      backdrop-filter: blur(4px);
      z-index: var(--z-modal);
      align-items: center; justify-content: center;
    }
    .cs-overlay.show { display: flex; }
    .cs-card {
      background: var(--color-surface);
      border-radius: var(--radius-2xl);
      padding: var(--space-10) var(--space-10) var(--space-8);
      text-align: center;
      max-width: 300px; width: 88%;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.22s var(--ease-out);
    }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .cs-icon {
      width: 48px; height: 48px;
      background: var(--lavender-100);
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-5);
    }
    .cs-title {
      font-family: var(--font-display);
      font-style: italic;
      font-size: var(--text-2xl);
      color: var(--color-text-primary);
      margin-bottom: var(--space-3);
      letter-spacing: var(--tracking-tight);
    }
    .cs-sub {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: var(--leading-normal);
    }
    .cs-btn {
      margin-top: var(--space-6);
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%;
      padding: var(--space-3) var(--space-6);
      background: var(--lavender-300);
      color: var(--lavender-700);
      border: none; border-radius: var(--radius-full);
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      font-weight: 500;
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      transition: background var(--dur-fast), box-shadow var(--dur-fast);
    }
    .cs-btn:hover {
      background: var(--lavender-400);
      color: #fff;
      box-shadow: var(--shadow-brand);
    }

    /* ══════════════════════════════
       TOAST
    ══════════════════════════════ */
    .toast-container {
      position: fixed;
      bottom: clamp(var(--space-8), 8vw, var(--space-12));
      left: 50%; transform: translateX(-50%);
      z-index: var(--z-toast);
      display: flex; flex-direction: column; gap: var(--space-2);
      align-items: center;
      pointer-events: none;
    }
    .toast {
      display: inline-flex; align-items: center; gap: var(--space-3);
      background: var(--color-text-primary);
      color: #fff;
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      font-weight: 500;
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg);
      white-space: nowrap;
      animation: toastIn 0.25s var(--ease-out);
    }
    .toast.removing { animation: toastOut 0.2s var(--ease-in-out) forwards; }
    @keyframes toastIn  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes toastOut { from { opacity:1; transform:translateY(0);   } to { opacity:0; transform:translateY(4px); } }

    /* ══════════════════════════════
       PAGE ENTRY ANIMATION
    ══════════════════════════════ */
    .fade-up {
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp var(--dur-slower) var(--ease-out) forwards;
    }
    .fade-up:nth-child(2) { animation-delay: 80ms; }
    .fade-up:nth-child(3) { animation-delay: 140ms; }
    .fade-up:nth-child(4) { animation-delay: 200ms; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <a href="index.html" class="navbar-logo">HUIHUI Travel</a>
    <ul class="navbar-links">
      <li><a href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a></li>
      <li><a href="gallery.html">갤러리</a></li>
      <li><a href="game.html">게임</a></li>
    </ul>
    <div class="navbar-right">
      <button class="lang-btn" id="langBtn" onclick="cycleLang()">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1.5C8 1.5 5.5 4 5.5 8s2.5 6.5 2.5 6.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M8 1.5C8 1.5 10.5 4 10.5 8s-2.5 6.5-2.5 6.5" stroke="currentColor" stroke-width="1.2"/>
          <line x1="1.5" y1="8" x2="14.5" y2="8" stroke="currentColor" stroke-width="1.2"/>
          <line x1="2.5" y1="5.5" x2="13.5" y2="5.5" stroke="currentColor" stroke-width="1.2"/>
          <line x1="2.5" y1="10.5" x2="13.5" y2="10.5" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span id="langLabel">한국어</span>
      </button>
    </div>
  </nav>

  <!-- ── HERO ── -->
  <section class="hero">
    <div class="hero-inner">
      <p class="hero-eyebrow fade-up" id="heroEyebrow">Studio.Vec · 국내 여행 큐레이션</p>
      <h1 class="hero-title fade-up" id="heroTitle">
        <em>국내 여행 안내서</em>
      </h1>
      <p class="hero-desc fade-up" id="heroDesc">
        직접 다녀온 국내 여행 코스를 공유합니다.<br>
        소소한 기억들
      </p>
      <div class="hero-meta fade-up">
        <div class="checkout-pill">
          <span class="checkout-pill-dot"></span>
          <span class="checkout-pill-text" id="checkoutStatus">0/8 체크아웃 완료</span>
        </div>
        <div class="checkout-track">
          <div class="checkout-fill" id="checkoutFill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── SECTION LABEL ── -->
  <div class="section-label">
    <span class="section-label-text" id="sectionLabel">여행 코스</span>
    <div class="section-label-line"></div>
  </div>

  <!-- ── KEY GRID ── -->
  <section class="grid-section">
    <div class="key-grid" id="keyGrid"></div>
  </section>

  <!-- ── BELL ── -->
  <div class="bell-wrapper" id="bellWrapper" onclick="ringBell()" title="프런트 데스크">
    <div class="bell-inner">
      <div class="bell-top" id="bellTop">
        <img class="bell-img" src="assets/bell-up.svg" alt="bell"/>
      </div>
      <div class="bell-bottom">
        <img class="bell-img bell-img-down" src="assets/bell-down.svg" alt=""/>
      </div>
    </div>
  </div>

  <!-- ── FOOTER ── -->
  <footer class="footer">
    <div>
      <div class="footer-brand">HUIHUI Travel</div>
      <div class="footer-tagline" style="margin-top:4px">국내 여행 안내서 · Studio.Vec</div>
    </div>
    <div class="footer-right">
      <a href="#" class="footer-link">소개</a>
      <a href="#" class="footer-link">Instagram</a>
      <span class="footer-link">© 2025</span>
    </div>
  </footer>

  <!-- ── COMING SOON POPUP ── -->
  <div class="cs-overlay" id="csOverlay" onclick="hideComingSoonPopup(event)">
    <div class="cs-card" onclick="event.stopPropagation()">
      <div class="cs-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="var(--lavender-500)" stroke-width="1.8"/>
          <path d="M12 7v5.5M12 15.5v.5" stroke="var(--lavender-500)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="cs-title">준비중이에요</div>
      <p class="cs-sub">조금만 기다려주세요.<br>곧 공개될 예정이에요!</p>
      <button class="cs-btn" onclick="hideComingSoonPopup()">확인</button>
    </div>
  </div>

  <!-- ── TOAST CONTAINER ── -->
  <div class="toast-container" id="toastContainer"></div>

        eyebrow: 'Studio.Vec · 国内旅游精选',

        desc:    '分享亲自探访的国内旅游路线。<br>留下美好的小记忆。',
        section: '旅游路线',

    let langIdx = 0;

    function _updateHeroText(code = 'ko') {
      const t = HERO_TEXTS[code];
      document.getElementById('heroEyebrow').textContent = t.eyebrow;
      document.getElementById('heroTitle').innerHTML     = t.title;
      document.getElementById('heroDesc').innerHTML      = t.desc;
      document.getElementById('sectionLabel').textContent = t.section;
    }

    function cycleLang() {
      langIdx = (langIdx + 1) % LANGS.length;
      const code = LANGS[langIdx].code;
      document.getElementById('langLabel').textContent = LANGS[langIdx].label;
      _updateHeroText(code);
      _updateCheckoutUI(code);
      _renderGrid();
      _attachLongPress();
    }
    function goTo(url) { window.location.href = url; }

    function showComingSoonPopup() {
      document.getElementById('csOverlay').classList.add('show');
    }
    function hideComingSoonPopup(e) {
      document.getElementById('csOverlay').classList.remove('show');
    }
    function ringBell() {
      const top = document.getElementById('bellTop');
      top.classList.add('ringing');
      setTimeout(() => top.classList.remove('ringing'), 500);
      showToast('딩동! 프런트 데스크입니다 🔔');
    }

    /* ── TOAST ── */
    function showToast(msg) {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => {
        t.classList.add('removing');
        setTimeout(() => t.remove(), 200);
      }, 2200);
    }

    /* ── CHECKOUT UI ── */
    function _updateCheckoutUI(code = 'ko') {
      const visited = TRIPS.filter((t, i) => _effectiveStatus(t, i) === 'visited').length;
      const total   = TRIPS.length;
      const pct     = total ? Math.round((visited / total) * 100) : 0;
      document.getElementById('checkoutStatus').textContent = CHECKOUT_LABELS[code](visited, total);
      document.getElementById('checkoutFill').style.width = pct + '%';
    }

    /* ── UTILITIES ── */
    function _fmtNo(no) { return String(no).padStart(2, '0'); }

      return `<svg style="width:64%;height:84%;transform:translateY(8%)" viewBox="0 0 208.06 357.17" xmlns="http://www.w3.org/2000/svg">

  <path fill="url(#cs_gr_${no})" opacity="0.55" d="M188.02,122.08l-51.22-99.91c-15.15-29.55-57.39-29.55-72.54,0L13.04,122.08c-17.38,33.91-17.38,74.11,0,108.02l51.22,99.91c15.15,29.55,57.39,29.55,72.54,0l51.22-99.91c17.38-33.91,17.38-74.11,0-108.02ZM100.53,47.87c-6.99,0-12.65-5.66-12.65-12.65s5.66-12.65,12.65-12.65,12.65,5.66,12.65,12.65-5.66,12.65-12.65,12.65Z"/>

  <text font-family="Cormorant Garamond,serif" font-size="21.1" font-style="italic" transform="translate(107.5 60.23) skewX(-5.61)" fill="#4E3490">No.${n}</text>

    }

    function _notVisitedSVG(no, tagline) {
      const n  = _fmtNo(no);
      const tl = tagline || '';
      return `<svg style="width:64%;height:84%;transform:translateY(8%)" viewBox="0 0 208.06 357.17" xmlns="http://www.w3.org/2000/svg">

    const _placeholderKey = `<svg style="width:60%;height:70%" viewBox="0 0 80 200" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="40" cy="38" r="30" stroke="#8B6FD0" stroke-width="2.5" fill="rgba(192,168,255,0.15)"/>
<circle cx="40" cy="38" r="20" stroke="#A68EE8" stroke-width="1.8" fill="rgba(237,229,255,0.25)"/>
<circle cx="40" cy="38" r="8" fill="rgba(139,111,208,0.25)" stroke="#8B6FD0" stroke-width="1.5"/>
<rect x="37" y="68" width="6" height="100" rx="3" fill="rgba(139,111,208,0.35)" stroke="#8B6FD0" stroke-width="1.5"/>
<rect x="43" y="110" width="12" height="8" rx="2" fill="rgba(139,111,208,0.45)" stroke="#8B6FD0" stroke-width="1.2"/>
<rect x="43" y="126" width="8"  height="8" rx="2" fill="rgba(139,111,208,0.45)" stroke="#8B6FD0" stroke-width="1.2"/>
<rect x="43" y="142" width="12" height="8" rx="2" fill="rgba(139,111,208,0.45)" stroke="#8B6FD0" stroke-width="1.2"/>
</svg>`;

    function _onKeyImgError(img) { img.outerHTML = _placeholderKey; }

    function _visitedKeyHTML(trip) {
      if (trip.key) return `<img src="${trip.key}" style="margin-top:20px" alt="key" onerror="_onKeyImgError(this)" />`;
      return _placeholderKey;
    }

    /* ── STATE (localStorage) ── */
    const VISITED_KEY  = 'huihui_visited';
    const RESERVED_KEY = 'huihui_reserved';
    const HOLD_MS      = 600;

    function _getSet(key) {
      try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
      catch(e) { return new Set(); }
    }
    function _saveSet(key, s) { localStorage.setItem(key, JSON.stringify([...s])); }

    let visitedSet  = _getSet(VISITED_KEY);
    let reservedSet = _getSet(RESERVED_KEY);

    function _effectiveStatus(trip, i) {
      if (visitedSet.has(trip.url)) return 'visited';
      if (reservedSet.has(i))                   return 'reserved';
      return trip.status;
    }

    /* ── RENDER CARD ── */
    function _renderCard(trip, i) {
      const s       = _effectiveStatus(trip, i);
      const cl      = 'key-card' + (s !== 'visited' ? ' ' + s : '');
      const isKo    = LANGS[langIdx].code === 'ko';
      const label   = isKo ? trip.nameKo : trip.nameEn;
      const nameCls = s === 'coming-soon' ? 'card-name coming-soon' : 'card-name';
      let keyHTML   = '';
      if      (s === 'visited')     keyHTML = `<div class="card-key-img">${_visitedKeyHTML(trip)}</div>`;
      else if (s === 'reserved')    keyHTML = `<div class="card-key-img">${_reservedSVG(trip.no)}</div>`;
      else if (s === 'not-visited') keyHTML = `<div class="card-key-img">${_notVisitedSVG(trip.no, trip.tagline)}</div>`;
      else if (s === 'coming-soon') keyHTML = `<div class="card-key-img">${_comingSoonSVG(trip.no)}</div>`;
      return `<div class="${cl}" data-trip-idx="${i}"><div class="card-3d">${_cardBgSVG(i)}<div class="${nameCls}">${_nameTagSVG(i)}<span>${label}</span></div>${keyHTML}</div></div>`;
    }

    function _attachCardClicks() {
      document.querySelectorAll('[data-trip-idx]').forEach(card => {
        const i = parseInt(card.dataset.tripIdx);
        card.addEventListener('click', () => {
          const trip = TRIPS[i];
          const st   = _effectiveStatus(trip, i);
          if (st === 'coming-soon')                              showComingSoonPopup();
          else if ((st === 'visited' || st === 'not-visited') && trip.url) goTo(trip.url);
        });
      });
    }

    /* ── LONG PRESS → reserved toggle ── */
    function _toggleReserved(i) {
      if (reservedSet.has(i)) reservedSet.delete(i);
      else                    reservedSet.add(i);
      _saveSet(RESERVED_KEY, reservedSet);
      _renderGrid();
    }

    let _longPressReady = false;
    function _attachLongPress() {
      if (_longPressReady) return;
      _longPressReady = true;
      const grid = document.getElementById('keyGrid');
      let timer = null, activeCard = null;
      const cancel = () => {
        clearTimeout(timer); timer = null;
        if (activeCard) { activeCard.classList.remove('pressing'); activeCard = null; }
      };
      grid.addEventListener('pointerdown', e => {
        const card = e.target.closest('[data-trip-idx]');
        if (!card) return;
        const i = parseInt(card.dataset.tripIdx);
        if (_effectiveStatus(TRIPS[i], i) === 'visited') return;
        e.preventDefault();
        activeCard = card;
        card.classList.add('pressing');
        card.setPointerCapture(e.pointerId);
        timer = setTimeout(() => { cancel(); _toggleReserved(i); }, HOLD_MS);
      });
      grid.addEventListener('pointerup',     cancel);
      grid.addEventListener('pointercancel', cancel);
      grid.addEventListener('pointermove', e => {
        if (!timer) return;
        if (e.target.closest('[data-trip-idx]') !== activeCard) cancel();
      });
    }

    /* ── BUILD TRIPS FROM CONFIG ── */
    function _buildTrips() {
      return Object.entries(TRIP_CONFIG).map(([slug, cfg], idx) => ({
        nameEn:  slug.charAt(0).toUpperCase() + slug.slice(1),
        nameKo:  cfg.nameKo  || slug,
        status:  cfg.status  || 'not-visited',
        url:     `trips/${slug}.html`,
        no:      cfg.no      || (idx + 1),
        key:     cfg.key     || null,
        tagline: cfg.tagline || '',
      }));
    }

    function _renderGrid() {
      document.getElementById('keyGrid').innerHTML =
        TRIPS.map((t, i) => _renderCard(t, i)).join('');
      _updateCheckoutUI(LANGS[langIdx].code);
      _attachCardClicks();
    }

    function _init() {
      TRIPS = _buildTrips();
      _renderGrid();
      _attachLongPress();
    }

    _init();

    /* bfcache 복원 시 localStorage 재읽기 */
    window.addEventListener('pageshow', e => {
      if (!e.persisted) return;
      visitedSet  = _getSet(VISITED_KEY);
      reservedSet = _getSet(RESERVED_KEY);
      _renderGrid();
    });
  </script>
