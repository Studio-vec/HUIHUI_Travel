<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>여행 퀴즈 — HUIHUI Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--color-bg); color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }

    /* NAVBAR */
    .navbar {
      position: sticky; top: 0; z-index: var(--z-fixed);
      background: rgba(255,248,235,0.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      height: 56px; padding: 0 clamp(var(--space-5), 5vw, var(--space-12));
      display: flex; align-items: center; gap: var(--space-6);
    }
    .navbar-logo {
      font-family: var(--font-display); font-size: 20px; font-style: italic; font-weight: 600;
      color: var(--lavender-600); text-decoration: none; letter-spacing: 0.02em; flex-shrink: 0;
    }
    .navbar-links { display: flex; list-style: none; gap: var(--space-1); }
    .navbar-links a {
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 500;
      color: var(--color-text-secondary); text-decoration: none;
      letter-spacing: var(--tracking-wide);
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
      transition: color var(--dur-fast), background var(--dur-fast);
    }
    .navbar-links a:hover, .navbar-links a.active { color: var(--lavender-600); background: var(--lavender-50); }

    /* ── HAMBURGER & MOBILE MENU ── */
    .hamburger-btn {
      display:none; flex-shrink:0; margin-left:auto;
      background:none; border:none; cursor:pointer;
      width:36px; height:36px; border-radius:10px;
      align-items:center; justify-content:center;
      color:var(--lavender-600); transition:background 0.15s;
    }
    .hamburger-btn:hover { background:var(--lavender-50); }
    .mobile-menu {
      position:fixed; top:56px; left:0; right:0; z-index:49;
      background:rgba(255,248,235,0.97); backdrop-filter:blur(20px);
      border-bottom:1px solid rgba(139,111,208,0.12);
      padding:8px 12px 14px; display:none; flex-direction:column;
      box-shadow:0 8px 32px rgba(80,40,160,0.1);
    }
    .mobile-menu.open { display:flex; }
    .mm-item {
      font-family:var(--font-heading); font-size:15px; font-weight:500;
      color:var(--color-text-secondary); text-decoration:none;
      padding:11px 14px; border-radius:12px;
      display:flex; align-items:center; gap:10px;
      transition:color 0.15s,background 0.15s;
      background:none; border:none; cursor:pointer; width:100%; text-align:left;
    }
    .mm-item:hover { color:var(--lavender-600); background:rgba(139,111,208,0.08); }
    .mm-item.active { color:var(--lavender-600); font-weight:600; }
    @media (max-width:767px) {
      .navbar-links { display:none !important; }
      .hamburger-btn { display:flex; }
    }

    /* LAYOUT */
    .game-wrap {
      max-width: 560px; margin: 0 auto;
      padding: var(--space-12) clamp(var(--space-5), 5vw, var(--space-8)) var(--space-24);
      display: flex; flex-direction: column; gap: var(--space-8);
    }

    /* HEADER */
    .game-header { display: flex; flex-direction: column; gap: var(--space-2); }
    .game-eyebrow {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 600;
      letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--lavender-500);
    }
    .game-title {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(28px, 6vw, 40px); color: var(--color-text-primary);
      line-height: 1.1;
    }
    .game-desc { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-loose); }

    /* SCORE BAR */
    .score-bar {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-4) var(--space-6);
      background: var(--color-surface); border: 1.5px solid var(--color-border);
      border-radius: var(--radius-xl);
    }
    .score-item { display: flex; flex-direction: column; gap: 2px; align-items: center; flex: 1; }
    .score-num {
      font-family: var(--font-display); font-style: italic;
      font-size: var(--text-2xl); font-weight: 600; line-height: 1;
      color: var(--lavender-600);
    }
    .score-label {
      font-family: var(--font-heading); font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--color-text-tertiary);
    }
    .score-sep { width: 1px; height: 36px; background: var(--color-border); }
    .progress-wrap { flex: 2; display: flex; flex-direction: column; gap: var(--space-2); }
    .progress-label { font-family: var(--font-heading); font-size: 10px; color: var(--color-text-tertiary); letter-spacing: var(--tracking-widest); text-transform: uppercase; }
    .progress-track { height: 6px; background: var(--sand-200); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--lavender-300), var(--lime-300)); border-radius: 99px; transition: width 0.4s var(--ease-out); }

    /* QUESTION CARD */
    .question-card {
      background: var(--color-surface); border: 1.5px solid var(--color-border);
      border-radius: var(--radius-2xl); padding: var(--space-8) var(--space-8) var(--space-6);
      display: flex; flex-direction: column; gap: var(--space-6);
      transition: opacity 0.2s;
    }
    .question-card.fading { opacity: 0; transform: translateY(8px); }
    .q-label {
      font-family: var(--font-heading); font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--lavender-500);
    }
    .q-place {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(22px, 4vw, 30px); color: var(--color-text-primary); line-height: 1.2;
    }
    .q-tip {
      font-size: var(--text-sm); color: var(--color-text-secondary);
      line-height: var(--leading-loose);
      padding: var(--space-4) var(--space-5);
      background: var(--sand-50); border-radius: var(--radius-lg);
      border-left: 3px solid var(--lavender-300);
    }
    .q-hint {
      font-family: var(--font-heading); font-size: var(--text-xs);
      color: var(--color-text-tertiary); letter-spacing: var(--tracking-wide);
    }

    /* CHOICES */
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .choice-btn {
      padding: var(--space-4) var(--space-5);
      border: 1.5px solid var(--color-border); border-radius: var(--radius-xl);
      background: var(--color-surface); cursor: pointer;
      display: flex; flex-direction: column; gap: var(--space-1);
      transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast);
      text-align: left;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: var(--lavender-300); background: var(--lavender-50); transform: translateY(-1px);
    }
    .choice-btn:disabled { cursor: default; }
    .choice-btn.correct { border-color: var(--lime-400); background: var(--lime-50); }
    .choice-btn.wrong   { border-color: #f8a0a0; background: #fff5f5; }
    .choice-name {
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 600;
      color: var(--color-text-primary);
    }
    .choice-btn.correct .choice-name { color: var(--lime-700); }
    .choice-btn.wrong .choice-name   { color: #c0392b; }
    .choice-sub { font-size: var(--text-xs); color: var(--color-text-tertiary); }
    .choice-icon { font-size: 18px; margin-bottom: var(--space-1); }

    /* FEEDBACK */
    .feedback {
      padding: var(--space-4) var(--space-5);
      border-radius: var(--radius-xl);
      display: none; flex-direction: column; gap: var(--space-2);
    }
    .feedback.show { display: flex; }
    .feedback.correct-fb { background: var(--lime-50); border: 1px solid var(--lime-200); }
    .feedback.wrong-fb   { background: #fff5f5;        border: 1px solid #ffd0d0; }
    .feedback-title {
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 600;
    }
    .feedback.correct-fb .feedback-title { color: var(--lime-700); }
    .feedback.wrong-fb   .feedback-title { color: #c0392b; }
    .feedback-desc { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-normal); }

    /* NEXT BTN */
    .next-btn {
      display: none; width: 100%;
      padding: var(--space-4); border-radius: var(--radius-full);
      background: var(--lavender-300); color: var(--lavender-700);
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 600;
      letter-spacing: var(--tracking-wide); border: none; cursor: pointer;
      transition: background var(--dur-fast), color var(--dur-fast);
    }
    .next-btn:hover { background: var(--lavender-400); color: #fff; }
    .next-btn.show { display: block; }

    /* RESULT SCREEN */
    .result-screen {
      display: none; flex-direction: column; align-items: center; gap: var(--space-6);
      text-align: center; padding: var(--space-10) var(--space-6);
      background: var(--color-surface); border: 1.5px solid var(--lavender-200);
      border-radius: var(--radius-2xl);
    }
    .result-screen.show { display: flex; }
    .result-emoji { font-size: 52px; }
    .result-title {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(28px, 5vw, 38px); color: var(--color-text-primary);
    }
    .result-score {
      font-family: var(--font-display); font-style: italic;
      font-size: 56px; font-weight: 600; color: var(--lavender-600); line-height: 1;
    }
    .result-desc { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-loose); }
    .result-actions { display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 500;
      letter-spacing: var(--tracking-wide); border: none; cursor: pointer;
      text-decoration: none; border-radius: var(--radius-full);
      padding: var(--space-3) var(--space-6);
      transition: background var(--dur-fast), color var(--dur-fast);
    }
    .btn-primary { background: var(--lavender-300); color: var(--lavender-700); }
    .btn-primary:hover { background: var(--lavender-400); color: #fff; }
    .btn-ghost { background: var(--sand-200); color: var(--color-text-secondary); }
    .btn-ghost:hover { background: var(--sand-300); color: var(--color-text-primary); }

    /* LOADING */
    .state-box { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding: var(--space-16) 0; }
    .loading-spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--lavender-200); border-top-color: var(--lavender-500); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { font-size: var(--text-sm); color: var(--color-text-tertiary); }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-logo">HUIHUI Travel</a>
  <ul class="navbar-links">
    <li><a href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a></li>
    <li><a href="gallery.html">갤러리</a></li>
    <li><a href="game.html" class="active">게임</a></li>
  </ul>
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴">
    <svg width="20" height="15" viewBox="0 0 20 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1.5h18M1 7.5h18M1 13.5h18"/></svg>
  </button>
</nav>
<div class="mobile-menu" id="mobileMenu">
  <a class="mm-item" href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a>
  <a class="mm-item" href="gallery.html">갤러리</a>
  <a class="mm-item active" href="game.html">게임</a>
</div>

<div class="game-wrap">
  <div class="game-header">
    <p class="game-eyebrow">Travel Quiz</p>
    <h1 class="game-title">어느 여행지일까요?</h1>
    <p class="game-desc">여행자들이 남긴 팁을 읽고, 어느 여행지의 장소인지 맞춰보세요.</p>
  </div>

  <div id="loadingState" class="state-box">
    <div class="loading-spinner"></div>
    <span class="state-text">퀴즈 준비 중...</span>
  </div>

  <div id="gameArea" style="display:none; display:flex; flex-direction:column; gap:var(--space-6)">

    <!-- 점수 바 -->
    <div class="score-bar">
      <div class="score-item">
        <span class="score-num" id="scoreNum">0</span>
        <span class="score-label">정답</span>
      </div>
      <div class="score-sep"></div>
      <div class="score-item">
        <span class="score-num" id="wrongNum">0</span>
        <span class="score-label">오답</span>
      </div>
      <div class="score-sep"></div>
      <div class="progress-wrap">
        <span class="progress-label" id="progressLabel">1 / 10</span>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:10%"></div>
        </div>
      </div>
    </div>

    <!-- 문제 카드 -->
    <div class="question-card" id="questionCard">
      <span class="q-label" id="qLabel">Question 1</span>
      <div class="q-place" id="qPlace"></div>
      <div class="q-tip" id="qTip"></div>
      <span class="q-hint">👇 이 장소가 속한 여행지는?</span>
    </div>

    <!-- 보기 -->
    <div class="choices" id="choices"></div>

    <!-- 피드백 -->
    <div class="feedback" id="feedback">
      <span class="feedback-title" id="fbTitle"></span>
      <span class="feedback-desc" id="fbDesc"></span>
    </div>

    <!-- 다음 버튼 -->
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 →</button>

    <!-- 결과 화면 -->
    <div class="result-screen" id="resultScreen">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-score" id="resultScore"></div>
      <p class="result-desc" id="resultDesc"></p>
      <div class="result-actions">
        <button class="btn btn-primary" onclick="restartGame()">다시 도전하기</button>
        <a href="gallery.html" class="btn btn-ghost">갤러리 보기</a>
      </div>
    </div>

  </div>
</div>

<script>
const TRIPS_LIST = ['yeosu','icheon','gangneung','paju','suwon','dongincheon'];
const TRIP_NAMES = { yeosu:'여수', icheon:'이천', gangneung:'강릉', paju:'파주', suwon:'수원', dongincheon:'동인천' };
const TRIP_TAGS  = { yeosu:'빛의 항구', icheon:'쌀알 나들이', gangneung:'힙플 나들이', paju:'트렌디 나들이', suwon:'트렌디 나들이', dongincheon:'개항로 산책' };

let quizPool = [];
let questions = [];
let current   = 0;
let score     = 0;
let wrong     = 0;
const TOTAL   = 10;

async function init() {
  const results = await Promise.allSettled(
    TRIPS_LIST.map(id => fetch('trips/data/' + id + '.json').then(r => r.json()))
  );

  results.forEach((r, i) => {
    if (r.status !== 'fulfilled') return;
    const course = r.value;
    const id = TRIPS_LIST[i];
    course.places.forEach(p => {
      p.tips.filter(t => !t.isOperator && t.body.length > 20).forEach(t => {
        quizPool.push({ tipBody: t.body, placeName: p.name, tripId: id, placeDesc: p.desc });
      });
    });
  });

  if (quizPool.length < 4) {
    document.getElementById('loadingState').innerHTML =
      '<span class="state-text">퀴즈 데이터가 부족해요</span>';
    return;
  }

  startGame();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  questions = shuffle([...quizPool]).slice(0, TOTAL);
  current = score = wrong = 0;
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('gameArea').style.display = 'flex';
  document.getElementById('resultScreen').classList.remove('show');
  updateScore();
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const card = document.getElementById('questionCard');
  card.classList.remove('fading');

  document.getElementById('qLabel').textContent = 'Question ' + (current + 1);
  document.getElementById('qPlace').textContent = q.placeName;
  document.getElementById('qTip').textContent = '"' + q.tipBody + '"';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.remove('show');

  // build 4 choices: correct + 3 random wrong
  const correct = q.tripId;
  const others  = shuffle(TRIPS_LIST.filter(id => id !== correct)).slice(0, 3);
  const choices = shuffle([correct, ...others]);

  const emojis = { yeosu:'🌊', icheon:'🏺', gangneung:'☕', paju:'📚', suwon:'🏯', dongincheon:'⚓' };

  document.getElementById('choices').innerHTML = choices.map(id => `
    <button class="choice-btn" onclick="answer('${id}', '${correct}', this)">
      <span class="choice-icon">${emojis[id]}</span>
      <span class="choice-name">${TRIP_NAMES[id]}</span>
      <span class="choice-sub">${TRIP_TAGS[id]}</span>
    </button>
  `).join('');

  updateScore();
}

function answer(chosen, correct, btn) {
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  const fb      = document.getElementById('feedback');
  const fbTitle = document.getElementById('fbTitle');
  const fbDesc  = document.getElementById('fbDesc');

  if (chosen === correct) {
    btn.classList.add('correct');
    score++;
    fb.className = 'feedback show correct-fb';
    fbTitle.textContent = '정답! 🎉';
    fbDesc.textContent  = TRIP_NAMES[correct] + '의 ' + questions[current].placeName + '이(가) 맞아요!';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.querySelector('.choice-name').textContent === TRIP_NAMES[correct]) b.classList.add('correct');
    });
    wrong++;
    fb.className = 'feedback show wrong-fb';
    fbTitle.textContent = '아쉽게도 틀렸어요';
    fbDesc.textContent  = '정답은 ' + TRIP_NAMES[correct] + '의 ' + questions[current].placeName + '이에요.';
  }

  updateScore();

  if (current + 1 >= TOTAL) {
    document.getElementById('nextBtn').textContent = '결과 보기 →';
    document.getElementById('nextBtn').onclick = showResult;
  }
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion() {
  const card = document.getElementById('questionCard');
  card.classList.add('fading');
  setTimeout(() => {
    current++;
    renderQuestion();
  }, 180);
}

function showResult() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('choices').style.display = 'none';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('nextBtn').classList.remove('show');

  const pct = Math.round((score / TOTAL) * 100);
  let emoji, title, desc;
  if      (pct === 100) { emoji = '🏆'; title = '완벽해요!';      desc = '모든 문제를 맞혔어요. 여행 전문가네요!'; }
  else if (pct >= 70)   { emoji = '🌟'; title = '대단해요!';      desc = '여행 감각이 예리하신데요?'; }
  else if (pct >= 40)   { emoji = '🗺️';  title = '꽤 잘하셨어요!'; desc = '더 많은 여행지를 둘러보면 점수가 올라갈 거예요.'; }
  else                  { emoji = '✈️'; title = '여행을 떠나볼까요?'; desc = '코스를 따라가다 보면 자연스럽게 알게 될 거예요!'; }

  document.getElementById('resultEmoji').textContent  = emoji;
  document.getElementById('resultTitle').textContent  = title;
  document.getElementById('resultScore').textContent  = score + ' / ' + TOTAL;
  document.getElementById('resultDesc').textContent   = desc;
  document.getElementById('resultScreen').classList.add('show');
}

function restartGame() {
  document.getElementById('questionCard').style.display = '';
  document.getElementById('choices').style.display = '';
  document.getElementById('feedback').style.display = '';
  startGame();
}

function updateScore() {
  document.getElementById('scoreNum').textContent    = score;
  document.getElementById('wrongNum').textContent    = wrong;
  document.getElementById('progressLabel').textContent = (current + 1) + ' / ' + TOTAL;
  document.getElementById('progressFill').style.width = ((current + 1) / TOTAL * 100) + '%';
}

init();

/* ── HAMBURGER ── */
(function(){
  const btn  = document.getElementById('hamburgerBtn');
  const menu = document.getElementById('mobileMenu');
  function closeMobileMenu() { menu.classList.remove('open'); }
  btn.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', e => { if (!menu.contains(e.target)) closeMobileMenu(); });
})();
</script>
</body>
</html>
