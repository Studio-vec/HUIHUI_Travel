<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>갤러리 — HUIHUI Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--color-bg); color: var(--color-text-primary); font-family: var(--font-body); min-height: 100vh; }

    /* NAVBAR */
    .navbar {
      position: sticky; top: 0; z-index: var(--z-fixed);
      background: rgba(255,248,235,0.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      height: 56px; padding: 0 clamp(var(--space-5), 5vw, var(--space-12));
      display: flex; align-items: center; gap: var(--space-6);
    }
    .navbar-logo {
      font-family: var(--font-display); font-size: 20px; font-style: italic; font-weight: 600;
      color: var(--lavender-600); text-decoration: none; letter-spacing: 0.02em; flex-shrink: 0;
    }
    .navbar-links { display: flex; list-style: none; gap: var(--space-1); }
    .navbar-links a {
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 500;
      color: var(--color-text-secondary); text-decoration: none;
      letter-spacing: var(--tracking-wide);
      padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
      transition: color var(--dur-fast), background var(--dur-fast);
    }
    .navbar-links a:hover, .navbar-links a.active { color: var(--lavender-600); background: var(--lavender-50); }
    @media (max-width: 600px) { .navbar-links { display: none; } }

    /* PAGE */
    .page-header {
      max-width: 900px; margin: 0 auto;
      padding: var(--space-12) clamp(var(--space-5), 5vw, var(--space-12)) var(--space-8);
    }
    .page-eyebrow {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 600;
      letter-spacing: var(--tracking-widest); text-transform: uppercase;
      color: var(--lavender-500); margin-bottom: var(--space-3);
    }
    .page-title {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(32px, 6vw, 52px); color: var(--color-text-primary);
      line-height: 1.1; letter-spacing: var(--tracking-tight);
    }
    .page-desc {
      font-size: var(--text-sm); color: var(--color-text-secondary);
      margin-top: var(--space-3); line-height: var(--leading-loose);
    }

    /* FILTERS */
    .filter-bar {
      max-width: 900px; margin: 0 auto;
      padding: 0 clamp(var(--space-5), 5vw, var(--space-12)) var(--space-6);
      display: flex; gap: var(--space-2); flex-wrap: wrap;
    }
    .filter-chip {
      font-family: var(--font-heading); font-size: var(--text-xs); font-weight: 600;
      letter-spacing: var(--tracking-wide);
      padding: var(--space-2) var(--space-4); border-radius: var(--radius-full);
      border: 1.5px solid var(--color-border); background: var(--color-surface);
      color: var(--color-text-secondary); cursor: pointer;
      transition: all var(--dur-fast);
    }
    .filter-chip:hover { border-color: var(--lavender-300); color: var(--lavender-600); }
    .filter-chip.active { border-color: var(--lavender-400); background: var(--lavender-100); color: var(--lavender-600); }

    /* GRID */
    .gallery-grid {
      max-width: 900px; margin: 0 auto;
      padding: 0 clamp(var(--space-5), 5vw, var(--space-12)) var(--space-24);
      columns: 3 220px; column-gap: var(--space-4);
    }
    .photo-card {
      break-inside: avoid;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-xl);
      background: var(--color-surface);
      overflow: hidden;
      margin-bottom: var(--space-4);
      cursor: pointer;
      transition: border-color var(--dur-base), box-shadow var(--dur-base), transform var(--dur-base);
    }
    .photo-card:hover {
      border-color: var(--lavender-200);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .photo-card-img {
      width: 100%; aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-style: italic;
      font-size: var(--text-sm); color: var(--lavender-400);
      position: relative; overflow: hidden;
    }
    .photo-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-card-info {
      padding: var(--space-4) var(--space-5) var(--space-5);
      display: flex; flex-direction: column; gap: var(--space-2);
    }
    .photo-card-trip {
      font-family: var(--font-heading); font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-widest); text-transform: uppercase;
      color: var(--lavender-500);
    }
    .photo-card-place {
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 600;
      color: var(--color-text-primary);
    }
    .photo-card-tags { display: flex; gap: var(--space-1); flex-wrap: wrap; }
    .tag {
      display: inline-flex; align-items: center;
      font-family: var(--font-heading); font-size: 10px; font-weight: 500;
      letter-spacing: var(--tracking-wide);
      padding: 2px var(--space-2); border-radius: var(--radius-full);
    }
    .tag-lavender { background: var(--lavender-100); color: var(--lavender-600); }
    .tag-lime     { background: var(--lime-100);     color: var(--lime-600); }
    .tag-sand     { background: var(--sand-200);     color: var(--sand-600); }

    /* EMPTY / LOADING */
    .state-box {
      max-width: 900px; margin: var(--space-16) auto;
      text-align: center; padding: var(--space-10);
      display: flex; flex-direction: column; align-items: center; gap: var(--space-4);
    }
    .loading-spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--lavender-200); border-top-color: var(--lavender-500);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-text { font-size: var(--text-sm); color: var(--color-text-tertiary); }

    /* LIGHTBOX */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(42,31,72,0.88); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: var(--space-8);
    }
    .lightbox.show { display: flex; }
    .lightbox-card {
      background: var(--color-surface); border-radius: var(--radius-2xl);
      max-width: 480px; width: 100%; overflow: hidden;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.2s var(--ease-out);
    }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .lightbox-img {
      width: 100%; aspect-ratio: 16/10;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-style: italic; font-size: 20px;
      color: var(--lavender-400);
    }
    .lightbox-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lightbox-body { padding: var(--space-6) var(--space-7) var(--space-7); }
    .lightbox-trip { font-family: var(--font-heading); font-size: 10px; font-weight: 600; letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--lavender-500); margin-bottom: var(--space-2); }
    .lightbox-place { font-family: var(--font-display); font-style: italic; font-size: 24px; color: var(--color-text-primary); margin-bottom: var(--space-3); }
    .lightbox-desc { font-size: var(--text-sm); color: var(--color-text-secondary); line-height: var(--leading-loose); margin-bottom: var(--space-5); }
    .lightbox-actions { display: flex; gap: var(--space-3); }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2);
      font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 500;
      letter-spacing: var(--tracking-wide); border: none; cursor: pointer;
      text-decoration: none; border-radius: var(--radius-full);
      padding: var(--space-3) var(--space-6);
      transition: background var(--dur-fast), color var(--dur-fast);
    }
    .btn-primary { background: var(--lavender-300); color: var(--lavender-700); }
    .btn-primary:hover { background: var(--lavender-400); color: #fff; }
    .btn-ghost { background: transparent; color: var(--color-text-secondary); }
    .btn-ghost:hover { background: var(--sand-200); }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-logo">HUIHUI Travel</a>
  <ul class="navbar-links">
    <li><a href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a></li>
    <li><a href="gallery.html" class="active">갤러리</a></li>
    <li><a href="game.html">게임</a></li>
  </ul>
</nav>

<div class="page-header">
  <p class="page-eyebrow">Gallery</p>
  <h1 class="page-title">모든 여행의 장면들</h1>
  <p class="page-desc">각 코스에서 담아온 장소들을 한눈에 모아봤어요.</p>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">전체</button>
</div>

<div id="galleryState" class="state-box">
  <div class="loading-spinner"></div>
  <span class="state-text">사진 불러오는 중...</span>
</div>
<div class="gallery-grid" id="galleryGrid" style="display:none"></div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-card" onclick="event.stopPropagation()">
    <div class="lightbox-img" id="lbImg"></div>
    <div class="lightbox-body">
      <div class="lightbox-trip" id="lbTrip"></div>
      <div class="lightbox-place" id="lbPlace"></div>
      <p class="lightbox-desc" id="lbDesc"></p>
      <div class="lightbox-actions">
        <a href="#" class="btn btn-primary" id="lbLink">코스 보기 →</a>
        <button class="btn btn-ghost" onclick="document.getElementById('lightbox').classList.remove('show')">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
const TRIPS_LIST = ['yeosu','icheon','gangneung','paju','suwon','dongincheon'];
let allItems = [];

async function loadAll() {
  const results = await Promise.allSettled(
    TRIPS_LIST.map(id => fetch('trips/data/' + id + '.json').then(r => r.json()))
  );
  results.forEach((r, i) => {
    if (r.status !== 'fulfilled') return;
    const course = r.value;
    course.places.forEach(p => {
      p.photos.forEach(photo => {
        allItems.push({ photo, place: p, course, tripId: TRIPS_LIST[i] });
      });
    });
  });

  // build filter chips
  const bar = document.getElementById('filterBar');
  TRIPS_LIST.forEach(id => {
    const course = results[TRIPS_LIST.indexOf(id)];
    if (course.status !== 'fulfilled') return;
    const chip = document.createElement('button');
    chip.className = 'filter-chip';
    chip.dataset.filter = id;
    chip.textContent = course.value.title.split(',')[0].trim();
    chip.onclick = () => setFilter(id, chip);
    bar.appendChild(chip);
  });

  document.getElementById('galleryState').style.display = 'none';
  document.getElementById('galleryGrid').style.display = '';
  renderGallery('all');
}

let currentFilter = 'all';
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderGallery(f);
}

function renderGallery(filter) {
  const items = filter === 'all' ? allItems : allItems.filter(it => it.tripId === filter);
  const grid = document.getElementById('galleryGrid');

  if (items.length === 0) {
    grid.innerHTML = '<div class="state-box"><span class="state-text">사진이 없어요</span></div>';
    return;
  }

  // gradient palettes per trip
  const palettes = {
    yeosu:       ['135deg, var(--lavender-200), var(--lavender-100)'],
    icheon:      ['135deg, var(--lime-100), var(--sand-100)'],
    gangneung:   ['135deg, #b3d9f7, var(--lavender-100)'],
    paju:        ['135deg, var(--sand-200), var(--lavender-100)'],
    suwon:       ['135deg, var(--lime-200), var(--sand-100)'],
    dongincheon: ['135deg, #f5c6a0, var(--sand-100)'],
  };

  grid.innerHTML = items.map((it, idx) => {
    const grad = palettes[it.tripId] || ['135deg, var(--lavender-100), var(--sand-100)'];
    const tagsHTML = it.place.tags.map(t =>
      `<span class="tag ${t.style}">${t.label}</span>`
    ).join('');
    const isUrl = it.photo.startsWith('http') || it.photo.match(/\.(jpg|jpeg|png|webp|gif)$/i);
    const imgContent = isUrl
      ? `<img src="${it.photo}" alt="${it.place.name}" loading="lazy"/>`
      : `<span style="background:linear-gradient(${grad});width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-size:13px;color:var(--lavender-400)">${it.photo}</span>`;

    return `
    <div class="photo-card" onclick="openLightbox(${idx})">
      <div class="photo-card-img">${imgContent}</div>
      <div class="photo-card-info">
        <span class="photo-card-trip">${it.course.title.split(',')[0].trim()}</span>
        <span class="photo-card-place">${it.place.name}</span>
        <div class="photo-card-tags">${tagsHTML}</div>
      </div>
    </div>`;
  }).join('');
}

function openLightbox(idx) {
  const items = currentFilter === 'all' ? allItems : allItems.filter(it => it.tripId === currentFilter);
  const it = items[idx];
  if (!it) return;

  const isUrl = it.photo.startsWith('http') || it.photo.match(/\.(jpg|jpeg|png|webp|gif)$/i);
  const palettes = {
    yeosu: '135deg, var(--lavender-200), var(--lavender-100)',
    icheon: '135deg, var(--lime-100), var(--sand-100)',
    gangneung: '135deg, #b3d9f7, var(--lavender-100)',
    paju: '135deg, var(--sand-200), var(--lavender-100)',
    suwon: '135deg, var(--lime-200), var(--sand-100)',
    dongincheon: '135deg, #f5c6a0, var(--sand-100)',
  };
  document.getElementById('lbImg').innerHTML = isUrl
    ? `<img src="${it.photo}" alt="${it.place.name}" style="width:100%;height:100%;object-fit:cover"/>`
    : `<div style="width:100%;height:100%;background:linear-gradient(${palettes[it.tripId] || '135deg,var(--lavender-200),var(--sand-100)'});display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;font-size:18px;color:var(--lavender-400)">${it.photo}</div>`;

  document.getElementById('lbTrip').textContent = it.course.title;
  document.getElementById('lbPlace').textContent = it.place.name;
  document.getElementById('lbDesc').textContent = it.place.desc;
  document.getElementById('lbLink').href = 'trip.html?id=' + it.tripId;
  document.getElementById('lightbox').classList.add('show');
}

function closeLightbox(e) {
  if (e.target === e.currentTarget) document.getElementById('lightbox').classList.remove('show');
}

loadAll();
</script>
</body>
</html>
