<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>갤러리 — HUIHUI Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--color-bg); color:var(--color-text-primary); font-family:var(--font-body); min-height:100vh; overflow-x:hidden; }

    /* NAVBAR */
    .navbar { position:sticky; top:0; z-index:50; background:rgba(255,248,235,0.88); backdrop-filter:blur(16px); border-bottom:1px solid var(--color-border); height:56px; padding:0 clamp(var(--space-5),5vw,var(--space-12)); display:flex; align-items:center; gap:var(--space-6); }
    .navbar-logo { font-family:var(--font-display); font-size:20px; font-style:italic; font-weight:600; color:var(--lavender-600); text-decoration:none; flex-shrink:0; }
    .navbar-links { display:flex; list-style:none; gap:var(--space-1); }
    .navbar-links a { font-family:var(--font-heading); font-size:var(--text-sm); font-weight:500; color:var(--color-text-secondary); text-decoration:none; padding:var(--space-2) var(--space-3); border-radius:var(--radius-md); transition:color var(--dur-fast),background var(--dur-fast); }
    .navbar-links a:hover, .navbar-links a.active { color:var(--lavender-600); background:var(--lavender-50); }
    @media(max-width:600px){.navbar-links{display:none;}}

    /* PAGE HEADER */
    .page-header { max-width:800px; margin:0 auto; padding:var(--space-10) clamp(var(--space-5),5vw,var(--space-12)) var(--space-6); text-align:center; }
    .page-eyebrow { font-family:var(--font-heading); font-size:var(--text-xs); font-weight:600; letter-spacing:var(--tracking-widest); text-transform:uppercase; color:var(--lavender-500); margin-bottom:var(--space-3); }
    .page-title { font-family:var(--font-display); font-style:italic; font-size:clamp(30px,5vw,48px); color:var(--color-text-primary); line-height:1.1; }
    .page-desc { font-size:var(--text-sm); color:var(--color-text-tertiary); margin-top:var(--space-2); }

    /* KEY RACK */
    .key-rack-section { padding:var(--space-4) 0 var(--space-12); }
    .key-rack { display:flex; gap:clamp(28px,4vw,52px); padding:var(--space-4) clamp(var(--space-6),8vw,var(--space-16)); overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; justify-content:center; flex-wrap:wrap; }
    .key-rack::-webkit-scrollbar { display:none; }
    .key-item { flex-shrink:0; scroll-snap-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; cursor:pointer; user-select:none; transition:transform 0.2s; }
    .key-item:hover { transform:translateY(-5px); }
    .key-item.coming-soon { cursor:default; opacity:0.35; pointer-events:none; }
    .key-nametag { background:rgba(255,255,255,0.85); backdrop-filter:blur(8px); border:1px solid rgba(139,111,208,0.2); border-radius:20px; padding:5px 18px; font-family:var(--font-heading); font-size:13px; font-weight:600; color:var(--color-text-primary); white-space:nowrap; }
    .key-item.unvisited .key-nametag { color:var(--color-text-tertiary); }
    .key-img-wrap { position:relative; width:100px; height:150px; display:flex; align-items:flex-start; justify-content:center; }
    .key-hook { position:absolute; top:0; left:50%; transform:translateX(-50%); width:2px; height:12px; background:rgba(139,111,208,0.3); border-radius:2px; }
    .key-img { width:100%; height:100%; object-fit:contain; margin-top:8px; transform-origin:center top; }
    .key-item.unvisited .key-img { filter:grayscale(0.8) brightness(0.65); }
    .key-item.visited:hover .key-img { animation:keySwingHover 0.7s ease-in-out; }
    @keyframes keySwingHover { 0%,100%{transform:rotate(0)} 30%{transform:rotate(-9deg)} 70%{transform:rotate(9deg)} }
    .key-status-dot { width:7px; height:7px; border-radius:50%; background:var(--lavender-400); box-shadow:0 0 6px var(--lavender-400); }
    .key-item.unvisited .key-status-dot { background:var(--color-border); box-shadow:none; }

    /* ══════════════════════════════
       CRYSTAL BALL SYSTEM
    ══════════════════════════════ */

    /* Semi-transparent backdrop — page still visible */
    .kh-backdrop {
      position:fixed; inset:0; z-index:100;
      background:rgba(8,4,20,0.52);
      backdrop-filter:blur(4px) brightness(0.7);
      opacity:0; pointer-events:none;
      transition:opacity 0.5s;
    }
    .kh-backdrop.show { opacity:1; pointer-events:all; }

    /* ─── DESCENDING KEY ─── */
    .kh-key-fall {
      position:fixed; z-index:115;
      width:clamp(60px,10vmin,100px);
      left:50%; top:50%;
      /* starts above the panel */
      transform:translate(-50%, calc(-50% - clamp(200px,35vmin,320px)));
      pointer-events:none;
      opacity:0;
    }
    .kh-key-fall img { width:100%; height:auto; filter:drop-shadow(0 8px 24px rgba(139,111,208,0.5)); }

    /* ─── PANEL (3D wall flip) ─── */
    .kh-panel {
      position:fixed; z-index:110;
      width:clamp(280px,55vmin,500px);
      height:clamp(280px,55vmin,500px);
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      perspective:1200px;
      pointer-events:none;
    }
    .kh-panel.active { pointer-events:all; }

    .kh-panel-inner {
      width:100%; height:100%;
      position:relative;
      transform-style:preserve-3d;
      transform:rotateY(0deg);
    }

    /* Front face = wall (same as page bg) */
    .kh-panel-front {
      position:absolute; inset:0;
      border-radius:50%;
      backface-visibility:hidden;
      background:var(--color-bg);
      box-shadow:
        inset 3px 3px 6px rgba(255,255,255,0.8),
        inset -3px -3px 6px rgba(0,0,0,0.08),
        0 6px 24px rgba(0,0,0,0.14),
        0 0 0 1px rgba(139,111,208,0.12);
      opacity:0;
    }

    /* Back face = dark portal (revealed after flip) */
    .kh-panel-back {
      position:absolute; inset:0;
      border-radius:50%;
      backface-visibility:hidden;
      transform:rotateY(180deg);
      background:rgb(4,2,12);
      overflow:hidden;
    }

    /* ─── CRYSTAL BALL INTERIOR ─── */
    /* The keyhole: starts small dark circle, expands to fill back face */
    .kh-ball-inner {
      position:absolute;
      width:42%; height:42%;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      overflow:hidden;
      background:rgb(4,2,12);
      box-shadow:0 0 0 0 rgba(139,111,208,0);
      /* width/height expand via JS classList */
      transition:
        width  0.9s cubic-bezier(0.34,1.1,0.64,1),
        height 0.9s cubic-bezier(0.34,1.1,0.64,1),
        background 1.2s ease 0.2s,
        box-shadow 1.2s ease 0.2s;
    }
    .kh-ball-inner.expand {
      width:100%; height:100%;
    }
    .kh-ball-inner.glow {
      background:radial-gradient(circle at 50% 50%,
        rgba(70,35,130,0.95) 0%,
        rgba(22,10,55,0.98) 50%,
        rgb(4,2,12) 100%);
      box-shadow:
        0 0 60px 20px rgba(139,111,208,0.28),
        0 0 120px 40px rgba(139,111,208,0.12),
        inset 0 0 80px rgba(0,0,0,0.45);
    }

    /* 3D globe */
    .kh-globe-wrap {
      position:absolute; inset:0;
      perspective:55vmin;
      overflow:hidden;
    }
    .kh-globe {
      position:absolute; inset:0;
      transform-style:preserve-3d;
      transform:rotateX(-15deg) rotateY(0deg);
      cursor:grab;
      opacity:0; transition:opacity 0.6s;
    }
    .kh-globe.show { opacity:1; }
    .kh-globe:active { cursor:grabbing; }

    .kh-globe-photo {
      position:absolute;
      width:24%; aspect-ratio:4/3;
      top:50%; left:50%;
      margin-top:-9%; margin-left:-12%;
      border-radius:6px; overflow:hidden;
      backface-visibility:hidden;
      border:1.5px solid rgba(255,255,255,0.22);
      box-shadow:0 4px 20px rgba(0,0,0,0.55);
    }
    .kh-globe-photo img { width:100%; height:100%; object-fit:cover; display:block; }

    .kh-globe-empty {
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:14px; color:rgba(255,255,255,0.3); padding:15%;
      font-family:var(--font-display); font-style:italic; text-align:center; line-height:1.6;
    }
    .kh-globe-empty span:first-child { font-size:40px; display:block; }

    /* Glass highlight (on top of globe, separate from clipping container) */
    .kh-glass {
      position:absolute; inset:0; border-radius:50%;
      pointer-events:none;
      background:
        radial-gradient(circle at 30% 23%, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.06) 26%, transparent 50%),
        radial-gradient(circle at 72% 76%, rgba(60,20,160,0.2) 0%, transparent 38%);
      z-index:5;
      opacity:0; transition:opacity 0.8s ease 0.3s;
    }
    .kh-glass.show { opacity:1; }

    /* UI overlay */
    .kh-ui {
      position:fixed; z-index:120;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:clamp(280px,55vmin,500px);
      height:clamp(280px,55vmin,500px);
      pointer-events:none;
    }
    .kh-close {
      position:absolute; top:-50px; right:-4px;
      background:rgba(255,255,255,0.12); border:none; color:rgba(255,255,255,0.75);
      width:38px; height:38px; border-radius:50%; font-size:17px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px); pointer-events:all; transition:background 0.2s;
      opacity:0;
    }
    .kh-close:hover { background:rgba(255,255,255,0.22); color:#fff; }
    .kh-dest-label {
      position:absolute; bottom:-46px; left:50%; transform:translateX(-50%);
      font-family:var(--font-display); font-style:italic;
      font-size:clamp(16px,2.5vmin,24px); color:rgba(255,255,255,0.88);
      white-space:nowrap; pointer-events:none; opacity:0;
    }
    .kh-hint {
      position:absolute; bottom:-70px; left:50%; transform:translateX(-50%);
      font-size:11px; font-family:var(--font-heading); letter-spacing:0.08em;
      color:rgba(255,255,255,0.3); white-space:nowrap; pointer-events:none; opacity:0;
    }
    .kh-trip-link {
      position:absolute; bottom:-98px; left:50%; transform:translateX(-50%);
      font-family:var(--font-heading); font-size:11px; font-weight:600; letter-spacing:0.07em;
      background:rgba(139,111,208,0.75); color:#fff;
      border-radius:20px; padding:6px 20px; text-decoration:none;
      backdrop-filter:blur(8px); pointer-events:all; opacity:0;
      transition:background 0.2s;
    }
    .kh-trip-link:hover { background:rgba(139,111,208,1); }

    /* ── UNVISITED POPUP ── */
    .unv-overlay { position:fixed; inset:0; z-index:300; background:rgba(20,10,40,0.7); backdrop-filter:blur(10px); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .unv-overlay.show { opacity:1; pointer-events:all; }
    .unv-card { background:var(--color-surface); border-radius:var(--radius-2xl); padding:var(--space-8) var(--space-8) var(--space-7); max-width:340px; width:90%; text-align:center; box-shadow:var(--shadow-xl); animation:slideUp 0.25s var(--ease-out); }
    @keyframes slideUp { from{transform:translateY(16px);opacity:0;} to{transform:translateY(0);opacity:1;} }
    .unv-icon { font-size:36px; margin-bottom:var(--space-4); display:block; }
    .unv-msg { font-family:var(--font-display); font-style:italic; font-size:18px; color:var(--color-text-primary); line-height:1.5; margin-bottom:var(--space-6); }
    .unv-btns { display:flex; gap:var(--space-3); }
    .unv-go { flex:1; display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-heading); font-size:var(--text-sm); font-weight:600; background:var(--lavender-400); color:#fff; border-radius:var(--radius-full); padding:var(--space-3) var(--space-4); text-decoration:none; transition:background 0.15s; }
    .unv-go:hover { background:var(--lavender-500); }
    .unv-cancel { flex:1; font-family:var(--font-heading); font-size:var(--text-sm); font-weight:500; background:var(--sand-200); color:var(--color-text-secondary); border:none; border-radius:var(--radius-full); padding:var(--space-3) var(--space-4); cursor:pointer; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-logo">HUIHUI Travel</a>
  <ul class="navbar-links">
    <li><a href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a></li>
    <li><a href="gallery.html" class="active">갤러리</a></li>
    <li><a href="game.html">게임</a></li>
  </ul>
</nav>

<div class="page-header">
  <p class="page-eyebrow">Gallery</p>
  <h1 class="page-title">모든 여행의 장면들</h1>
  <p class="page-desc">열쇠를 눌러 여행의 기억을 열어보세요</p>
</div>

<section class="key-rack-section">
  <div class="key-rack" id="keyRack"></div>
</section>

<!-- Semi-transparent backdrop -->
<div class="kh-backdrop" id="khBackdrop" onclick="closeKeyhole()"></div>

<!-- Descending key image -->
<div class="kh-key-fall" id="khKeyFall"><img id="khKeyFallImg" src="" alt=""></div>

<!-- 3D flip panel -->
<div class="kh-panel" id="khPanel">
  <div class="kh-panel-inner" id="khPanelInner">
    <div class="kh-panel-front" id="khPanelFront"></div>
    <div class="kh-panel-back">
      <div class="kh-ball-inner" id="khBallInner">
        <div class="kh-globe-wrap">
          <div class="kh-globe" id="khGlobe"></div>
        </div>
        <div class="kh-glass" id="khGlass"></div>
      </div>
    </div>
  </div>
</div>

<!-- UI (outside panel so it's not clipped) -->
<div class="kh-ui" id="khUI">
  <button class="kh-close" id="khClose" onclick="closeKeyhole()">✕</button>
  <div class="kh-dest-label" id="khDestLabel"></div>
  <div class="kh-hint">드래그해서 돌려보세요</div>
  <a href="#" class="kh-trip-link" id="khTripLink">코스 보기 →</a>
</div>

<!-- Unvisited popup -->
<div class="unv-overlay" id="unvOverlay" onclick="if(event.target===this)closeUnvisited()">
  <div class="unv-card">
    <span class="unv-icon">🔒</span>
    <p class="unv-msg" id="unvMsg"></p>
    <div class="unv-btns">
      <a href="#" class="unv-go" id="unvGo">여행하러 가기</a>
      <button class="unv-cancel" onclick="closeUnvisited()">닫기</button>
    </div>
  </div>
</div>

<script>
const DESTINATIONS = [
  { id:'yeosu',       nameKo:'여수',   storageKey:'trip_yeosu_v1',       url:'trips/yeosu.html',       p:'을' },
  { id:'icheon',      nameKo:'이천',   storageKey:'trip_icheon_v1',      url:'trips/icheon.html',      p:'을' },
  { id:'paju',        nameKo:'파주',   storageKey:'trip_paju_v1',        url:'trips/paju.html',        p:'를' },
  { id:'dongincheon', nameKo:'동인천', storageKey:'trip_dongincheon_v1', url:'trips/dongincheon.html', p:'을' },
  { id:'gangneung',   nameKo:'강릉',   storageKey:'trip_gangneung_v1',   url:'trips/gangneung.html',   p:'을' },
  { id:'nowon',       nameKo:'노원',   storageKey:'trip_nowon_v1',        url:'trips/nowon.html',       p:'을', comingSoon:true },
  { id:'suwon',       nameKo:'수원',   storageKey:'trip_suwon_v1',       url:'trips/suwon.html',       p:'을' },
  { id:'daejeon',     nameKo:'대전',   storageKey:'trip_daejeon_v1',      url:'trips/daejeon.html',     p:'을', comingSoon:true },
];

const delay = ms => new Promise(r => setTimeout(r, ms));

function getVisitedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('huihui_visited')||'[]')); }
  catch(e) { return new Set(); }
}
function getUserPhotos(storageKey) {
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return [];
    return JSON.parse(raw).flatMap(d=>d.places||[]).filter(p=>p.photo).map(p=>({photo:p.photo,name:p.name}));
  } catch(e) { return []; }
}

/* ── KEY RACK ── */
function renderKeyRack() {
  const visited = getVisitedSet();
  document.getElementById('keyRack').innerHTML = DESTINATIONS.map(dest => {
    if (dest.comingSoon) return `
      <div class="key-item coming-soon">
        <div class="key-nametag">${dest.nameKo}</div>
        <div class="key-img-wrap"><div class="key-hook"></div>
          <div style="width:100px;height:150px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-top:8px">🔑</div>
        </div><div class="key-status-dot" style="display:none"></div>
      </div>`;
    const isVisited = visited.has(dest.url);
    return `
      <div class="key-item ${isVisited?'visited':'unvisited'}" onclick="handleKeyClick('${dest.id}')">
        <div class="key-nametag">${dest.nameKo}</div>
        <div class="key-img-wrap">
          <div class="key-hook"></div>
          <img class="key-img" src="assets/keys/${dest.id}.png" alt="${dest.nameKo}" onerror="this.style.opacity='0.12'">
        </div>
        <div class="key-status-dot" style="${isVisited?'':'background:var(--color-border);box-shadow:none'}"></div>
      </div>`;
  }).join('');
}

function handleKeyClick(id) {
  const dest = DESTINATIONS.find(d=>d.id===id);
  if (!dest) return;
  if (getVisitedSet().has(dest.url)) openKeyhole(dest);
  else showUnvisited(dest);
}

/* ── SOUND ── */
function playClick() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const t = ctx.currentTime;
    [[900,280,0.18,0,0.09],[500,180,0.10,0.01,0.08]].forEach(([f0,f1,g,s,d])=>{
      const o=ctx.createOscillator(), gn=ctx.createGain();
      o.type='square';
      o.frequency.setValueAtTime(f0,t+s);
      o.frequency.exponentialRampToValueAtTime(f1,t+s+d);
      gn.gain.setValueAtTime(g,t+s);
      gn.gain.exponentialRampToValueAtTime(0.001,t+s+d);
      o.connect(gn); gn.connect(ctx.destination);
      o.start(t+s); o.stop(t+s+d+0.01);
    });
  } catch(e){}
}

function playInsert() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const t = ctx.currentTime;
    const o=ctx.createOscillator(), gn=ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(280,t);
    o.frequency.exponentialRampToValueAtTime(140,t+0.15);
    gn.gain.setValueAtTime(0.25,t); gn.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    o.connect(gn); gn.connect(ctx.destination);
    o.start(t); o.stop(t+0.2);
  } catch(e){}
}

/* ── MAIN OPEN SEQUENCE ── */
let isOpen = false;

async function openKeyhole(dest) {
  if (isOpen) return;
  isOpen = true;

  const photos = getUserPhotos(dest.storageKey);

  // Elements
  const backdrop   = document.getElementById('khBackdrop');
  const keyFall    = document.getElementById('khKeyFall');
  const keyFallImg = document.getElementById('khKeyFallImg');
  const panel      = document.getElementById('khPanel');
  const panelInner = document.getElementById('khPanelInner');
  const panelFront = document.getElementById('khPanelFront');
  const ballInner  = document.getElementById('khBallInner');
  const globe      = document.getElementById('khGlobe');
  const glass      = document.getElementById('khGlass');
  const ui         = document.getElementById('khUI');

  // Set content
  document.getElementById('khDestLabel').textContent = dest.nameKo;
  document.getElementById('khTripLink').href = dest.url;
  keyFallImg.src = `assets/keys/${dest.id}.png`;
  globe.innerHTML = '';
  buildGlobe(globe, photos);

  // Reset state
  panelInner.style.transition = 'none';
  panelInner.style.transform  = 'rotateY(0deg)';
  ballInner.classList.remove('expand','glow');
  glass.classList.remove('show');
  globe.classList.remove('show');
  panelFront.style.opacity = '0';
  panel.classList.add('active');
  setUIOpacity(0);

  // ① Backdrop fades in (page still visible behind)
  backdrop.classList.add('show');
  await delay(300);

  // ② Panel front face appears — wall illusion (no fade, immediate pop + subtle drop shadow grow)
  panelFront.style.transition = 'opacity 0s, box-shadow 0.4s';
  panelFront.style.opacity = '1';
  await delay(100);

  // ③ Key falls from above — 3D wall illusion: panel simultaneously starts slight Z-tilt
  playClick();
  keyFall.style.transition = 'none';
  // start position: above panel
  keyFall.style.transform = `translate(-50%, calc(-50% - clamp(200px,35vmin,320px)))`;
  keyFall.style.opacity = '0';
  await delay(20);
  keyFall.style.opacity = '1';
  keyFall.style.transition = 'transform 0.72s cubic-bezier(0.3,0,0.5,1), opacity 0.3s';
  // fall to center — slight overshoot
  keyFall.style.transform = 'translate(-50%, calc(-50% + 8px))';

  // While key falls: panel does subtle perspective-shift (3D wall illusion)
  panelInner.style.transition = 'transform 0.72s ease-out';
  panelInner.style.transform  = 'rotateY(-8deg) rotateX(4deg)';
  await delay(720);

  // ④ Key "inserts" — tiny forward nudge, click sound
  playInsert();
  keyFall.style.transition = 'transform 0.12s ease-in, opacity 0.2s ease-in 0.08s';
  keyFall.style.transform  = 'translate(-50%, calc(-50% + 20px))';
  keyFall.style.opacity    = '0';

  // ⑤ 3D panel flip (the wall section rotates open)
  panelInner.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
  panelInner.style.transform  = 'rotateY(180deg)';
  await delay(700);

  // ⑥ Keyhole (dark small circle) expands
  ballInner.classList.add('expand');
  await delay(500);

  // ⑦ Glow — dark void lights up into crystal ball
  ballInner.classList.add('glow');
  glass.classList.add('show');
  await delay(600);

  // ⑧ Globe photos fade in + UI appears
  globe.classList.add('show');
  setUIOpacity(1);
  startGlobeRotation(globe);
}

function setUIOpacity(v) {
  const t = v ? '0.5s' : '0.2s';
  document.querySelectorAll('.kh-close,.kh-dest-label,.kh-hint,.kh-trip-link').forEach(el => {
    el.style.transition = `opacity ${t}`;
    el.style.opacity = v;
  });
}

async function closeKeyhole() {
  if (!isOpen) return;
  stopGlobeRotation();

  document.getElementById('khBackdrop').classList.remove('show');
  setUIOpacity(0);

  const panelInner = document.getElementById('khPanelInner');
  const ballInner  = document.getElementById('khBallInner');
  const glass      = document.getElementById('khGlass');
  const globe      = document.getElementById('khGlobe');

  globe.classList.remove('show');
  glass.classList.remove('show');
  await delay(200);

  ballInner.classList.remove('expand','glow');
  await delay(500);

  panelInner.style.transition = 'transform 0.5s ease-in';
  panelInner.style.transform  = 'rotateY(0deg)';
  await delay(280);

  document.getElementById('khPanelFront').style.opacity = '0';
  document.getElementById('khPanel').classList.remove('active');
  document.getElementById('khKeyFall').style.opacity = '0';

  isOpen = false;
}

/* ── 3D GLOBE ── */
function buildGlobe(container, photos) {
  if (photos.length === 0) {
    container.innerHTML = `<div class="kh-globe-empty">
      <span>📷</span>
      <span>여행 페이지에서 사진을 추가하면<br>이 곳에서 돌려볼 수 있어요</span>
    </div>`;
    return;
  }
  const n = photos.length;
  const golden = Math.PI * (3 - Math.sqrt(5));
  photos.forEach((p, i) => {
    const y = 1 - (i / Math.max(n-1, 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1-y*y));
    const theta = golden * i;
    const rotY = Math.atan2(Math.cos(theta)*r, Math.sin(theta)*r) * 180/Math.PI;
    const rotX = Math.asin(Math.max(-1, Math.min(1, y))) * 180/Math.PI;
    const el = document.createElement('div');
    el.className = 'kh-globe-photo';
    el.style.transform = `rotateY(${rotY}deg) rotateX(${-rotX}deg) translateZ(25vmin)`;
    el.innerHTML = `<img src="${p.photo}" alt="${p.name}" loading="lazy">`;
    container.appendChild(el);
  });
}

/* Globe drag + auto-rotate */
let gRotX=-15, gRotY=0, gVelX=0, gVelY=0;
let gDragging=false, gLastX, gLastY, gRAF=null, gEl=null;

function updateGlobe() {
  if (gEl) gEl.style.transform = `rotateX(${gRotX}deg) rotateY(${gRotY}deg)`;
}
function globeLoop() {
  if (!gDragging) {
    gVelY += 0.10;
    gVelX *= 0.91; gVelY *= 0.985;
    gRotX  = Math.max(-50, Math.min(50, gRotX + gVelX));
    gRotY += gVelY;
    updateGlobe();
  }
  gRAF = requestAnimationFrame(globeLoop);
}
function startGlobeRotation(el) {
  gEl=el; gRotX=-15; gRotY=0; gVelX=0; gVelY=0;
  updateGlobe();
  el.addEventListener('mousedown',  onGrabStart);
  el.addEventListener('touchstart', onGrabStart, {passive:true});
  cancelAnimationFrame(gRAF);
  globeLoop();
}
function stopGlobeRotation() {
  cancelAnimationFrame(gRAF); gRAF=null;
  if (gEl) {
    gEl.removeEventListener('mousedown',  onGrabStart);
    gEl.removeEventListener('touchstart', onGrabStart);
    gEl=null;
  }
  gDragging=false;
}
function onGrabStart(e) {
  gDragging=true; gVelX=0; gVelY=0;
  const pt=e.touches?.[0]||e;
  gLastX=pt.clientX; gLastY=pt.clientY;
  const onMove=e=>{
    const pt=e.touches?.[0]||e;
    const dx=pt.clientX-gLastX, dy=pt.clientY-gLastY;
    gVelX=dy*0.38; gVelY=dx*0.38;
    gRotX=Math.max(-50,Math.min(50,gRotX+gVelX));
    gRotY+=gVelY;
    gLastX=pt.clientX; gLastY=pt.clientY;
    updateGlobe();
  };
  const onEnd=()=>{
    gDragging=false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup',   onEnd);
    document.removeEventListener('touchend',  onEnd);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('mouseup',   onEnd);
  document.addEventListener('touchend',  onEnd);
}
document.addEventListener('keydown', e=>{
  if (!isOpen) return;
  if (e.key==='Escape') closeKeyhole();
  if (e.key==='ArrowLeft')  gVelY=-3;
  if (e.key==='ArrowRight') gVelY= 3;
});

/* ── UNVISITED POPUP ── */
function showUnvisited(dest) {
  document.getElementById('unvMsg').innerHTML = `아직 <em>${dest.nameKo}</em>${dest.p}(를) 여행하지 않았어요!`;
  document.getElementById('unvGo').href = dest.url;
  document.getElementById('unvOverlay').classList.add('show');
}
function closeUnvisited() {
  document.getElementById('unvOverlay').classList.remove('show');
}

renderKeyRack();
</script>
