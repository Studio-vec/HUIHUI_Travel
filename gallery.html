<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>갤러리 — HUIHUI Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=DM+Sans:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--color-bg); color: var(--color-text-primary);
      font-family: var(--font-body); min-height: 100vh; overflow-x: hidden;
    }

    /* ── NAVBAR ── */
    .navbar {
      position: sticky; top: 0; z-index: 400;
      background: rgba(255,248,235,0.88); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      height: 56px; padding: 0 clamp(20px,5vw,48px);
      display: flex; align-items: center; gap: 24px;
    }
    .navbar-logo {
      font-family: var(--font-display); font-size: 20px; font-style: italic; font-weight: 600;
      color: var(--lavender-600); text-decoration: none; letter-spacing: 0.02em;
    }
    .navbar-links { display: flex; list-style: none; gap: 4px; }
    .navbar-links a {
      font-family: var(--font-heading); font-size: 13px; font-weight: 500;
      color: var(--color-text-secondary); text-decoration: none;
      letter-spacing: 0.04em;
      padding: 8px 12px; border-radius: 10px;
      transition: color 150ms, background 150ms;
    }
    .navbar-links a:hover, .navbar-links a.active { color: var(--lavender-600); background: var(--lavender-50); }
    @media (max-width: 600px) { .navbar-links { display: none; } }

    /* ── PAGE HEADER ── */
    .page-header {
      max-width: 900px; margin: 0 auto;
      padding: 48px clamp(20px,5vw,48px) 32px;
    }
    .page-eyebrow {
      font-family: var(--font-heading); font-size: 11px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--lavender-500); margin-bottom: 12px;
    }
    .page-title {
      font-family: var(--font-display); font-style: italic;
      font-size: clamp(32px, 6vw, 52px); color: var(--color-text-primary);
      line-height: 1.1; letter-spacing: -0.02em;
    }
    .page-desc {
      font-size: 13px; color: var(--color-text-secondary);
      margin-top: 12px; line-height: 1.8;
    }

    /* ── KEY RACK ── */
    .key-rack-wrap {
      max-width: 900px; margin: 0 auto;
      padding: 0 clamp(20px,5vw,48px) 48px;
    }
    .key-rack-label {
      font-family: var(--font-heading); font-size: 11px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--lavender-400); margin-bottom: 20px;
    }
    .key-rack {
      display: flex; gap: 20px;
      overflow-x: auto; padding-bottom: 12px;
      scrollbar-width: none;
    }
    .key-rack::-webkit-scrollbar { display: none; }
    .key-item {
      flex-shrink: 0; display: flex; flex-direction: column;
      align-items: center; gap: 10px; cursor: pointer;
    }
    .key-img-wrap {
      width: 72px; height: 104px;
      display: flex; align-items: center; justify-content: center;
      position: relative; transition: transform 200ms var(--ease-spring);
    }
    .key-item:hover .key-img-wrap { transform: translateY(-4px); }
    .key-img-wrap img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      transition: filter 250ms;
    }
    .key-item.unvisited .key-img-wrap img { filter: grayscale(1) opacity(0.45); }
    .key-name {
      font-family: var(--font-heading); font-size: 12px; font-weight: 500;
      color: var(--color-text-secondary); letter-spacing: 0.04em;
    }
    .key-item.visited .key-name { color: var(--lavender-600); }
    .key-badge {
      font-size: 10px; font-family: var(--font-heading); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--lavender-400); opacity: 0;
    }
    .key-item.visited .key-badge { opacity: 1; }

    /* ── SECTION DIVIDER ── */
    .section-divider {
      max-width: 900px; margin: 0 auto 32px;
      padding: 0 clamp(20px,5vw,48px);
      height: 1px; background: var(--color-border);
    }

    /* ── PHOTO GRID (existing photos) ── */
    .photo-section {
      max-width: 900px; margin: 0 auto;
      padding: 0 clamp(20px,5vw,48px) 96px;
    }
    .section-label {
      font-family: var(--font-heading); font-size: 11px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--lavender-400); margin-bottom: 20px;
    }
    .photo-grid {
      columns: 3 180px; column-gap: 12px;
    }
    .photo-thumb {
      break-inside: avoid; margin-bottom: 12px;
      border-radius: 12px; overflow: hidden;
      cursor: pointer; position: relative;
      border: 1.5px solid var(--color-border);
      transition: transform 200ms, box-shadow 200ms;
    }
    .photo-thumb:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .photo-thumb img { width:100%; display:block; }
    .photo-thumb-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 10px 8px;
      background: linear-gradient(to top, rgba(42,31,72,0.7) 0%, transparent 100%);
      font-size: 11px; font-family: var(--font-heading); color: #fff;
      opacity: 0; transition: opacity 200ms;
    }
    .photo-thumb:hover .photo-thumb-label { opacity: 1; }
    .no-photos {
      font-size: 13px; color: var(--color-text-tertiary);
      font-family: var(--font-heading); text-align: center;
      padding: 40px 0; line-height: 2;
    }

    /* ════════════════════════════════════════
       KEYHOLE OVERLAY SYSTEM
    ════════════════════════════════════════ */

    /* Semi-transparent page backdrop */
    #kh-backdrop {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(255,248,235,0.55);
      backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none;
      transition: opacity 300ms;
    }
    #kh-backdrop.show { opacity: 1; pointer-events: auto; }

    /* Panel wrapper — centered in viewport */
    #kh-panel {
      position: fixed; z-index: 600;
      top: 50%; left: 50%;
      width: clamp(300px, 60vmin, 540px);
      height: clamp(300px, 60vmin, 540px);
      transform: translate(-50%, -50%);
      perspective: 900px;
      pointer-events: none;
    }
    #kh-panel.show { pointer-events: auto; }

    /* 3D flip inner */
    #kh-panel-inner {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      transition: transform 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Panel face shared */
    .kh-face {
      position: absolute; inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* FRONT face — mimics the page "wall" */
    #kh-face-front {
      background: var(--color-bg);
      box-shadow: inset 0 0 40px rgba(42,31,72,0.06), 0 4px 32px rgba(42,31,72,0.14);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      opacity: 0;
      transition: opacity 150ms;
    }

    /* Key image that falls into the front face */
    #kh-key-fall {
      position: absolute;
      width: 72px; height: 104px;
      left: 50%; top: 50%;
      transform: translate(-50%, calc(-50% - 120px));
      transition: transform 600ms cubic-bezier(0.34, 1.2, 0.64, 1), opacity 400ms;
      z-index: 2;
    }
    #kh-key-fall img { width: 100%; height: 100%; object-fit: contain; }

    /* BACK face — the crystal ball */
    #kh-face-back {
      transform: rotateY(180deg);
      overflow: hidden;
      background: rgb(4, 2, 12);
      /* keyhole mask: starts small dark circle, expands */
      --kh-r: 42%;
      clip-path: circle(var(--kh-r) at 50% 50%);
      transition: clip-path 500ms cubic-bezier(0.22, 1, 0.36, 1), background 800ms;
    }
    #kh-face-back.expand {
      --kh-r: 50%;
      clip-path: circle(50% at 50% 50%);
    }
    #kh-face-back.glow {
      background: radial-gradient(circle at 38% 36%,
        #e8d8ff 0%, #c4a0f8 12%, #9260e8 30%,
        #5a28c8 52%, #2a0a80 72%, #06021a 100%);
    }

    /* Glass highlight */
    #kh-glass {
      position: absolute; inset: 0; border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55) 0%, transparent 38%),
        radial-gradient(circle at 70% 72%, rgba(160,120,255,0.18) 0%, transparent 40%);
      opacity: 0; transition: opacity 600ms;
      pointer-events: none; z-index: 10;
    }
    #kh-glass.show { opacity: 1; }

    /* Close button */
    #kh-close {
      position: absolute; top: -16px; right: -16px; z-index: 20;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,248,235,0.9); border: 1.5px solid var(--color-border);
      color: var(--color-text-secondary); font-size: 18px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 300ms;
      font-family: var(--font-heading);
    }
    #kh-close.show { opacity: 1; }

    /* Destination label */
    #kh-dest-label {
      position: absolute; bottom: -48px; left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display); font-style: italic;
      font-size: 22px; color: var(--color-text-primary);
      white-space: nowrap; opacity: 0; transition: opacity 400ms;
      pointer-events: none;
    }
    #kh-dest-label.show { opacity: 1; }

    /* UI controls inside crystal ball */
    #kh-ball-ui {
      position: absolute; bottom: 16px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 10px;
      z-index: 15; opacity: 0; transition: opacity 400ms;
    }
    #kh-ball-ui.show { opacity: 1; }
    .kh-ui-btn {
      font-family: var(--font-heading); font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em;
      padding: 6px 14px; border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.9);
      cursor: pointer; backdrop-filter: blur(4px);
      transition: background 150ms;
    }
    .kh-ui-btn:hover { background: rgba(255,255,255,0.22); }

    /* 3D Globe */
    #kh-globe {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      cursor: grab;
    }
    #kh-globe:active { cursor: grabbing; }
    .globe-photo {
      position: absolute;
      width: 60px; height: 60px;
      border-radius: 8px;
      overflow: hidden;
      transform-style: preserve-3d;
      /* centered via JS translate */
      backface-visibility: visible;
    }
    .globe-photo img { width:100%; height:100%; object-fit:cover; border-radius:8px; }

    /* ── UNVISITED POPUP ── */
    #unvisited-modal {
      position: fixed; inset: 0; z-index: 700;
      background: rgba(42,31,72,0.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 200ms;
    }
    #unvisited-modal.show { opacity: 1; pointer-events: auto; }
    .unvisited-card {
      background: var(--color-surface); border-radius: 24px;
      padding: 36px 32px 28px; max-width: 320px; width: 90%;
      box-shadow: var(--shadow-xl); text-align: center;
      animation: slideUp 0.2s var(--ease-out);
    }
    @keyframes slideUp { from { transform: translateY(14px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    .unvisited-icon { font-size: 36px; margin-bottom: 16px; }
    .unvisited-title {
      font-family: var(--font-display); font-style: italic;
      font-size: 20px; color: var(--color-text-primary);
      margin-bottom: 8px; line-height: 1.3;
    }
    .unvisited-hint {
      font-size: 13px; color: var(--color-text-secondary);
      line-height: 1.7; margin-bottom: 24px;
    }
    .unvisited-btns { display: flex; gap: 10px; }
    .unvisited-btn {
      flex: 1; padding: 12px 8px; border-radius: 999px;
      font-family: var(--font-heading); font-size: 13px; font-weight: 500;
      letter-spacing: 0.04em; border: none; cursor: pointer;
      text-decoration: none; display: flex; align-items: center;
      justify-content: center;
      transition: background 150ms, color 150ms;
    }
    .unvisited-btn-ghost {
      background: var(--sand-200); color: var(--color-text-secondary);
    }
    .unvisited-btn-ghost:hover { background: var(--sand-300); }
    .unvisited-btn-primary {
      background: var(--lavender-300); color: var(--lavender-700);
    }
    .unvisited-btn-primary:hover { background: var(--lavender-400); color: #fff; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-logo">HUIHUI Travel</a>
  <ul class="navbar-links">
    <li><a href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a></li>
    <li><a href="gallery.html" class="active">갤러리</a></li>
    <li><a href="game.html">게임</a></li>
  </ul>
</nav>

<div class="page-header">
  <p class="page-eyebrow">Gallery</p>
  <h1 class="page-title">모든 여행의 장면들</h1>
  <p class="page-desc">키를 눌러 여행을 추억해 보세요.</p>
</div>

<!-- KEY RACK -->
<div class="key-rack-wrap">
  <p class="key-rack-label">여행지 · Key</p>
  <div class="key-rack" id="keyRack"></div>
</div>

<div class="section-divider"></div>

<!-- PHOTO GRID -->
<div class="photo-section">
  <p class="section-label">사진 모음</p>
  <div class="photo-grid" id="photoGrid">
    <div class="no-photos">아직 등록된 사진이 없어요.<br>여행 코스 페이지에서 사진을 추가해 보세요.</div>
  </div>
</div>

<!-- KEYHOLE OVERLAY -->
<div id="kh-backdrop" onclick="closeKeyhole()"></div>

<div id="kh-panel">
  <div id="kh-panel-inner">
    <!-- Front: wall panel with falling key -->
    <div class="kh-face" id="kh-face-front">
      <div id="kh-key-fall"><img id="kh-key-img" src="" alt=""/></div>
    </div>
    <!-- Back: crystal ball -->
    <div class="kh-face" id="kh-face-back">
      <div id="kh-globe"></div>
      <div id="kh-glass"></div>
      <div id="kh-ball-ui">
        <button class="kh-ui-btn" onclick="closeKeyhole()">닫기</button>
      </div>
    </div>
  </div>
  <button id="kh-close" onclick="closeKeyhole()">×</button>
  <div id="kh-dest-label"></div>
</div>

<!-- UNVISITED MODAL -->
<div id="unvisited-modal" onclick="closeUnvisited(event)">
  <div class="unvisited-card" onclick="event.stopPropagation()">
    <div class="unvisited-icon">🗝️</div>
    <div class="unvisited-title" id="unvisited-title"></div>
    <p class="unvisited-hint">이 여행지를 방문하면<br>수정구슬에 추억이 담겨요.</p>
    <div class="unvisited-btns">
      <button class="unvisited-btn unvisited-btn-ghost" onclick="closeUnvisited()">닫기</button>
      <a class="unvisited-btn unvisited-btn-primary" id="unvisited-link" href="#">여행하러 가기</a>
    </div>
  </div>
</div>

<script>
/* ─── TRIP CONFIG ─── */
const TRIPS = [
  { id:'yeosu',       nameKo:'여수',   url:'trips/yeosu.html',       key:'assets/keys/yeosu.png',       storageKey:'trip_yeosu_v1' },
  { id:'icheon',      nameKo:'이천',   url:'trips/icheon.html',      key:'assets/keys/icheon.png',      storageKey:'trip_icheon_v1' },
  { id:'paju',        nameKo:'파주',   url:'trips/paju.html',        key:'assets/keys/paju.png',        storageKey:'trip_paju_v1' },
  { id:'dongincheon', nameKo:'동인천', url:'trips/dongincheon.html', key:'assets/keys/dongincheon.png', storageKey:'trip_dongincheon_v1' },
  { id:'gangneung',   nameKo:'강릉',   url:'trips/gangneung.html',   key:'assets/keys/gangneung.png',   storageKey:'trip_gangneung_v1' },
  { id:'suwon',       nameKo:'수원',   url:'trips/suwon.html',       key:'assets/keys/suwon.png',       storageKey:'trip_suwon_v1' },
];

/* ─── LOAD STATE ─── */
function getVisitedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('huihui_visited') || '[]')); }
  catch(e) { return new Set(); }
}

function getTripPhotos(storageKey) {
  try {
    const saved = localStorage.getItem(storageKey);
    if (!saved) return [];
    const schedule = JSON.parse(saved);
    return schedule.flatMap(d => d.places).filter(p => p.photo).map(p => ({ photo: p.photo, name: p.name }));
  } catch(e) { return []; }
}

const visitedSet = getVisitedSet();

/* ─── BUILD KEY RACK ─── */
const rack = document.getElementById('keyRack');
TRIPS.forEach(trip => {
  const visited = visitedSet.has(trip.url);
  const item = document.createElement('div');
  item.className = 'key-item ' + (visited ? 'visited' : 'unvisited');
  item.innerHTML = `
    <div class="key-img-wrap">
      <img src="${trip.key}" alt="${trip.nameKo}" onerror="this.style.display='none'"/>
    </div>
    <span class="key-name">${trip.nameKo}</span>
    <span class="key-badge">✓ 완료</span>
  `;
  item.onclick = () => visited ? openKeyhole(trip) : openUnvisited(trip);
  rack.appendChild(item);
});

/* ─── BUILD PHOTO GRID ─── */
function buildPhotoGrid() {
  const grid = document.getElementById('photoGrid');
  const allPhotos = [];
  TRIPS.forEach(trip => {
    if (!visitedSet.has(trip.url)) return;
    getTripPhotos(trip.storageKey).forEach(p => allPhotos.push({ ...p, tripNameKo: trip.nameKo }));
  });
  if (allPhotos.length === 0) return;
  grid.innerHTML = allPhotos.map(p => `
    <div class="photo-thumb">
      <img src="${p.photo}" alt="${p.name}" loading="lazy"/>
      <div class="photo-thumb-label">${p.tripNameKo} · ${p.name}</div>
    </div>
  `).join('');
}
buildPhotoGrid();

/* ─── UNVISITED MODAL ─── */
function openUnvisited(trip) {
  document.getElementById('unvisited-title').textContent =
    `아직 ${trip.nameKo}을(를) 여행하지 않았어요!`;
  document.getElementById('unvisited-link').href = trip.url;
  document.getElementById('unvisited-modal').classList.add('show');
}
function closeUnvisited(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('unvisited-modal').classList.remove('show');
}

/* ─── WEB AUDIO ─── */
const AC = typeof AudioContext !== 'undefined' ? new AudioContext() : null;
function playClick() {
  if (!AC) return;
  const b = AC.createOscillator();
  const g = AC.createGain();
  b.connect(g); g.connect(AC.destination);
  b.frequency.setValueAtTime(400, AC.currentTime);
  b.frequency.exponentialRampToValueAtTime(80, AC.currentTime + 0.08);
  g.gain.setValueAtTime(0.3, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.12);
  b.start(); b.stop(AC.currentTime + 0.12);
}
function playInsert() {
  if (!AC) return;
  const b = AC.createOscillator();
  const g = AC.createGain();
  b.connect(g); g.connect(AC.destination);
  b.type = 'sawtooth';
  b.frequency.setValueAtTime(220, AC.currentTime);
  b.frequency.exponentialRampToValueAtTime(110, AC.currentTime + 0.18);
  g.gain.setValueAtTime(0.15, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.22);
  b.start(); b.stop(AC.currentTime + 0.22);
}

/* ─── GLOBE ─── */
let globeAutoId = null;
let globeRot = { x: 15, y: 0 };
let globeVel = { x: 0, y: 0 };
let drag = null;

function buildGlobe(photos) {
  const globe = document.getElementById('kh-globe');
  globe.innerHTML = '';
  if (photos.length === 0) return;
  const n = Math.min(photos.length, 20);
  const phi = Math.PI * (3 - Math.sqrt(5)); // golden angle
  const r = Math.min(window.innerHeight, window.innerWidth) * 0.20;

  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const rad = Math.sqrt(1 - y * y);
    const theta = phi * i;
    const x = Math.cos(theta) * rad;
    const z = Math.sin(theta) * rad;

    const el = document.createElement('div');
    el.className = 'globe-photo';
    el.style.cssText = `
      transform: translate3d(${x * r - 30}px, ${y * r - 30}px, ${z * r}px);
    `;
    const img = document.createElement('img');
    img.src = photos[i % photos.length].photo;
    img.alt = photos[i % photos.length].name || '';
    el.appendChild(img);
    globe.appendChild(el);
  }
}

function applyGlobeRot() {
  const globe = document.getElementById('kh-globe');
  if (!globe) return;
  globe.style.transform = `rotateX(${globeRot.x}deg) rotateY(${globeRot.y}deg)`;
}

function startGlobeInteraction() {
  const panel = document.getElementById('kh-panel');
  panel.addEventListener('mousedown', onDragStart);
  panel.addEventListener('touchstart', onDragStart, { passive: true });
  window.addEventListener('mousemove', onDragMove);
  window.addEventListener('touchmove', onDragMove, { passive: false });
  window.addEventListener('mouseup', onDragEnd);
  window.addEventListener('touchend', onDragEnd);

  function tick() {
    if (drag) return;
    globeVel.x *= 0.95;
    globeVel.y *= 0.95;
    if (Math.abs(globeVel.y) < 0.05) globeVel.y = 0.3; // gentle auto-spin
    globeRot.x += globeVel.x;
    globeRot.y += globeVel.y;
    applyGlobeRot();
    globeAutoId = requestAnimationFrame(tick);
  }
  globeAutoId = requestAnimationFrame(tick);
}

function onDragStart(e) {
  const pt = e.touches ? e.touches[0] : e;
  drag = { x: pt.clientX, y: pt.clientY };
  globeVel = { x: 0, y: 0 };
  cancelAnimationFrame(globeAutoId);
}
function onDragMove(e) {
  if (!drag) return;
  if (e.cancelable) e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  const dx = pt.clientX - drag.x;
  const dy = pt.clientY - drag.y;
  globeRot.y += dx * 0.4;
  globeRot.x += dy * 0.4;
  globeVel = { x: dy * 0.4, y: dx * 0.4 };
  drag = { x: pt.clientX, y: pt.clientY };
  applyGlobeRot();
}
function onDragEnd() {
  if (!drag) return;
  drag = null;
  function tick() {
    globeVel.x *= 0.93;
    globeVel.y *= 0.93;
    if (Math.abs(globeVel.y) < 0.05) { startGlobeInteraction(); return; }
    globeRot.x += globeVel.x;
    globeRot.y += globeVel.y;
    applyGlobeRot();
    globeAutoId = requestAnimationFrame(tick);
  }
  tick();
}

function stopGlobeInteraction() {
  cancelAnimationFrame(globeAutoId);
  const panel = document.getElementById('kh-panel');
  panel.removeEventListener('mousedown', onDragStart);
  panel.removeEventListener('touchstart', onDragStart);
  window.removeEventListener('mousemove', onDragMove);
  window.removeEventListener('touchmove', onDragMove);
  window.removeEventListener('mouseup', onDragEnd);
  window.removeEventListener('touchend', onDragEnd);
}

/* ─── KEYHOLE ANIMATION ─── */
const delay = ms => new Promise(r => setTimeout(r, ms));
let keyholeOpen = false;

async function openKeyhole(trip) {
  if (keyholeOpen) return;
  keyholeOpen = true;

  const photos = getTripPhotos(trip.storageKey);
  const backdrop  = document.getElementById('kh-backdrop');
  const panel     = document.getElementById('kh-panel');
  const panelInner = document.getElementById('kh-panel-inner');
  const faceFront = document.getElementById('kh-face-front');
  const faceBack  = document.getElementById('kh-face-back');
  const keyFall   = document.getElementById('kh-key-fall');
  const keyImg    = document.getElementById('kh-key-img');
  const glass     = document.getElementById('kh-glass');
  const globe     = document.getElementById('kh-globe');
  const ballUI    = document.getElementById('kh-ball-ui');
  const closeBtn  = document.getElementById('kh-close');
  const destLabel = document.getElementById('kh-dest-label');

  // Reset state
  faceBack.classList.remove('expand','glow');
  glass.classList.remove('show');
  ballUI.classList.remove('show');
  closeBtn.classList.remove('show');
  destLabel.classList.remove('show');
  panelInner.style.transition = 'none';
  panelInner.style.transform  = 'rotateY(0deg) rotateX(0deg)';
  keyFall.style.transition    = 'none';
  keyFall.style.transform     = 'translate(-50%, calc(-50% - 140px))';
  keyFall.style.opacity       = '1';
  faceFront.style.opacity     = '0';
  destLabel.textContent       = trip.nameKo;
  keyImg.src                  = trip.key;
  globe.style.transform       = 'rotateX(15deg) rotateY(0deg)';
  globeRot                    = { x:15, y:0 };
  globeVel                    = { x:0, y:0 };

  // Resume transition after reset flush
  await delay(20);
  panelInner.style.transition = '';
  keyFall.style.transition    = '';

  // ① Backdrop + panel appear
  backdrop.classList.add('show');
  panel.classList.add('show');
  await delay(280);

  // ② Front face appears (wall illusion)
  faceFront.style.opacity = '1';
  await delay(120);

  // ③ Key falls down, panel tilts forward (perspective hint)
  if (AC) AC.resume();
  playClick();
  keyFall.style.transform = 'translate(-50%, calc(-50% + 6px))';
  panelInner.style.transform = 'rotateY(-10deg) rotateX(5deg)';
  await delay(680);

  // ④ Key inserts (fades, panel tilts back)
  playInsert();
  keyFall.style.opacity = '0';
  panelInner.style.transform = 'rotateY(-5deg) rotateX(2deg)';
  await delay(280);

  // ⑤ Panel flips to back (crystal ball side)
  panelInner.style.transform = 'rotateY(180deg)';
  await delay(720);

  // ⑥ Build globe with photos BEFORE keyhole expands
  buildGlobe(photos);

  // ⑦ Keyhole expands
  faceBack.classList.add('expand');
  await delay(520);

  // ⑧ Crystal glow + glass highlight
  faceBack.classList.add('glow');
  glass.classList.add('show');
  await delay(580);

  // ⑨ Globe controls + UI
  ballUI.classList.add('show');
  closeBtn.classList.add('show');
  destLabel.classList.add('show');
  startGlobeInteraction();
}

function closeKeyhole() {
  if (!keyholeOpen) return;
  keyholeOpen = false;
  stopGlobeInteraction();

  const backdrop  = document.getElementById('kh-backdrop');
  const panel     = document.getElementById('kh-panel');
  const panelInner = document.getElementById('kh-panel-inner');
  const faceFront = document.getElementById('kh-face-front');
  const faceBack  = document.getElementById('kh-face-back');
  const glass     = document.getElementById('kh-glass');
  const ballUI    = document.getElementById('kh-ball-ui');
  const closeBtn  = document.getElementById('kh-close');
  const destLabel = document.getElementById('kh-dest-label');

  ballUI.classList.remove('show');
  closeBtn.classList.remove('show');
  destLabel.classList.remove('show');
  glass.classList.remove('show');

  setTimeout(() => {
    faceBack.classList.remove('expand','glow');
    panelInner.style.transform = 'rotateY(0deg)';
    setTimeout(() => {
      faceFront.style.opacity = '0';
      backdrop.classList.remove('show');
      panel.classList.remove('show');
    }, 400);
  }, 200);
}
