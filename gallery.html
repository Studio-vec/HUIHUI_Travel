<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>갤러리 — HUIHUI Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/tokens.css"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { background:var(--color-bg); color:var(--color-text-primary); font-family:var(--font-body); min-height:100vh; overflow-x:hidden; }

    /* NAVBAR */
    .navbar {
      position:sticky; top:0; z-index:50;
      background:rgba(255,248,235,0.88); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--color-border);
      height:56px; padding:0 clamp(var(--space-5),5vw,var(--space-12));
      display:flex; align-items:center; gap:var(--space-6);
    }
    .navbar-logo { font-family:var(--font-display); font-size:20px; font-style:italic; font-weight:600; color:var(--lavender-600); text-decoration:none; flex-shrink:0; }
    .navbar-links { display:flex; list-style:none; gap:var(--space-1); }
    .navbar-links a { font-family:var(--font-heading); font-size:var(--text-sm); font-weight:500; color:var(--color-text-secondary); text-decoration:none; padding:var(--space-2) var(--space-3); border-radius:var(--radius-md); transition:color var(--dur-fast),background var(--dur-fast); }
    .navbar-links a:hover, .navbar-links a.active { color:var(--lavender-600); background:var(--lavender-50); }
    @media(max-width:600px){.navbar-links{display:none;}}

    /* PAGE HEADER */
    .page-header {
      max-width:800px; margin:0 auto;
      padding:var(--space-10) clamp(var(--space-5),5vw,var(--space-12)) var(--space-6);
      text-align:center;
    }
    .page-eyebrow { font-family:var(--font-heading); font-size:var(--text-xs); font-weight:600; letter-spacing:var(--tracking-widest); text-transform:uppercase; color:var(--lavender-500); margin-bottom:var(--space-3); }
    .page-title { font-family:var(--font-display); font-style:italic; font-size:clamp(30px,5vw,48px); color:var(--color-text-primary); line-height:1.1; }
    .page-desc { font-size:var(--text-sm); color:var(--color-text-tertiary); margin-top:var(--space-2); }

    /* KEY RACK */
    .key-rack-section {
      padding:var(--space-6) 0 var(--space-12);
    }
    .key-rack {
      display:flex; gap:clamp(32px,5vw,56px);
      padding:0 clamp(var(--space-6),8vw,var(--space-16)) var(--space-4);
      overflow-x:auto; scroll-snap-type:x mandatory;
      scrollbar-width:none; -webkit-overflow-scrolling:touch;
      justify-content:center; flex-wrap:wrap;
    }
    .key-rack::-webkit-scrollbar { display:none; }

    .key-item {
      flex-shrink:0; scroll-snap-align:center;
      display:flex; flex-direction:column; align-items:center; gap:14px;
      cursor:pointer; user-select:none;
      transition:transform 0.2s var(--ease-out);
    }
    .key-item:hover { transform:translateY(-6px); }
    .key-item.coming-soon { cursor:default; opacity:0.4; }
    .key-item.coming-soon:hover { transform:none; }

    .key-nametag {
      background:rgba(255,255,255,0.85); backdrop-filter:blur(8px);
      border:1px solid rgba(139,111,208,0.2); border-radius:20px;
      padding:5px 18px; order:-1;
      font-family:var(--font-heading); font-size:13px; font-weight:600;
      color:var(--color-text-primary); white-space:nowrap;
      box-shadow:0 2px 8px rgba(139,111,208,0.1);
    }
    .key-item.unvisited .key-nametag { color:var(--color-text-tertiary); }

    .key-img-wrap {
      position:relative; width:110px; height:160px;
      display:flex; align-items:flex-start; justify-content:center;
    }
    .key-hook {
      position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:2px; height:14px; background:rgba(139,111,208,0.3);
      border-radius:2px;
    }
    .key-img {
      width:100%; height:100%; object-fit:contain;
      margin-top:10px;
      transform-origin:center top;
      transition:transform 0.3s var(--ease-out), filter 0.3s;
    }
    .key-item.unvisited .key-img { filter:grayscale(0.85) brightness(0.75); }
    .key-item.visited:hover .key-img { animation:keySwingHover 0.8s ease-in-out; }
    @keyframes keySwingHover {
      0%,100%{transform:rotate(0deg);}
      25%{transform:rotate(-8deg);}
      75%{transform:rotate(8deg);}
    }

    .key-status-dot {
      width:8px; height:8px; border-radius:50%;
      background:var(--lavender-400);
      box-shadow:0 0 6px var(--lavender-400);
    }
    .key-item.unvisited .key-status-dot { background:var(--color-border); box-shadow:none; }
    .key-item.coming-soon .key-status-dot { display:none; }

    /* ── KEYHOLE SCENE ── */
    .kh-scene {
      position:fixed; inset:0; z-index:200;
      pointer-events:none; opacity:0;
      transition:opacity 0.4s;
    }
    .kh-scene.active { opacity:1; pointer-events:all; }

    /* SVG overlay (on top of sphere) */
    .kh-svg {
      position:absolute; inset:0; width:100%; height:100%;
      z-index:3; pointer-events:none;
    }

    /* Sphere (behind SVG) */
    .kh-sphere-wrap {
      position:absolute;
      width:min(80vmin,560px); height:min(80vmin,560px);
      top:50%; left:50%; transform:translate(-50%,-50%);
      border-radius:50%; overflow:hidden;
      z-index:2;
      box-shadow:
        inset -30px -30px 80px rgba(0,0,0,0.65),
        inset 20px 20px 50px rgba(255,255,255,0.12),
        0 0 80px rgba(139,111,208,0.25),
        0 30px 80px rgba(0,0,0,0.5);
      opacity:0; transition:opacity 0.5s;
    }
    .kh-scene.sphere-visible .kh-sphere-wrap { opacity:1; }

    /* 3D glass overlay */
    .kh-glass {
      position:absolute; inset:0; border-radius:50%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0.06) 35%, transparent 55%),
        radial-gradient(circle at 70% 74%, rgba(0,0,0,0.45) 0%, transparent 45%);
      pointer-events:none; z-index:10;
    }

    /* Photos inside sphere */
    .kh-photos { position:absolute; inset:0; }
    .kh-photo {
      position:absolute; inset:0;
      opacity:0; transition:opacity 0.5s;
    }
    .kh-photo.active { opacity:1; }
    .kh-photo img { width:100%; height:100%; object-fit:contain; display:block; background:rgb(6,3,15); }
    .kh-photo-empty {
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:12px; color:rgba(255,255,255,0.4);
      background:radial-gradient(circle at 50% 40%, rgba(139,111,208,0.3) 0%, rgba(20,10,40,0.9) 100%);
    }
    .kh-photo-empty span:first-child { font-size:40px; }
    .kh-photo-empty span { font-size:13px; font-family:var(--font-display); font-style:italic; }

    /* Sphere navigation */
    .kh-nav {
      position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
      display:flex; align-items:center; gap:10px; z-index:11;
    }
    .kh-dot {
      width:6px; height:6px; border-radius:50%;
      background:rgba(255,255,255,0.3); cursor:pointer;
      transition:background 0.2s, transform 0.2s;
    }
    .kh-dot.active { background:rgba(255,255,255,0.9); transform:scale(1.3); }

    .kh-arrow {
      position:absolute; top:50%; z-index:11;
      transform:translateY(-50%);
      background:rgba(255,255,255,0.12); border:none;
      color:rgba(255,255,255,0.8); width:36px; height:36px; border-radius:50%;
      font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background 0.2s; backdrop-filter:blur(4px);
    }
    .kh-arrow:hover { background:rgba(255,255,255,0.22); }
    .kh-arrow.prev { left:10px; }
    .kh-arrow.next { right:10px; }
    .kh-arrow:disabled { opacity:0.25; cursor:default; }

    /* Destination label + close (above SVG overlay) */
    .kh-ui {
      position:absolute; inset:0; z-index:20; pointer-events:none;
    }
    .kh-dest-label {
      position:absolute; top:clamp(20px,4vh,36px); left:50%; transform:translateX(-50%);
      font-family:var(--font-display); font-style:italic; font-size:clamp(20px,3vw,28px);
      color:rgba(255,255,255,0.9); white-space:nowrap;
      pointer-events:none;
    }
    .kh-photo-label {
      position:absolute; bottom:calc(50% - min(40vmin,280px) - 28px); left:50%; transform:translateX(-50%);
      font-size:11px; font-family:var(--font-heading); letter-spacing:0.08em;
      color:rgba(255,255,255,0.35); white-space:nowrap; pointer-events:none;
    }
    .kh-trip-link {
      position:absolute; bottom:clamp(20px,4vh,36px); left:50%; transform:translateX(-50%);
      font-family:var(--font-heading); font-size:12px; font-weight:600; letter-spacing:0.08em;
      background:rgba(139,111,208,0.85); color:#fff;
      border-radius:20px; padding:8px 22px; text-decoration:none;
      backdrop-filter:blur(8px); pointer-events:all;
      transition:background 0.2s;
    }
    .kh-trip-link:hover { background:rgba(139,111,208,1); }
    .kh-close {
      position:absolute; top:clamp(16px,3vh,28px); right:clamp(16px,3vw,32px);
      background:rgba(255,255,255,0.1); border:none; color:rgba(255,255,255,0.7);
      width:40px; height:40px; border-radius:50%; font-size:18px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px); pointer-events:all;
      transition:background 0.2s;
    }
    .kh-close:hover { background:rgba(255,255,255,0.2); color:#fff; }

    /* ── UNVISITED POPUP ── */
    .unv-overlay {
      position:fixed; inset:0; z-index:300;
      background:rgba(20,10,40,0.7); backdrop-filter:blur(10px);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity 0.3s;
    }
    .unv-overlay.show { opacity:1; pointer-events:all; }
    .unv-card {
      background:var(--color-surface); border-radius:var(--radius-2xl);
      padding:var(--space-8) var(--space-8) var(--space-7);
      max-width:340px; width:90%; text-align:center;
      box-shadow:var(--shadow-xl);
      animation:slideUp 0.25s var(--ease-out);
    }
    @keyframes slideUp { from{transform:translateY(16px);opacity:0;} to{transform:translateY(0);opacity:1;} }
    .unv-icon { font-size:36px; margin-bottom:var(--space-4); display:block; }
    .unv-msg {
      font-family:var(--font-display); font-style:italic;
      font-size:18px; color:var(--color-text-primary);
      line-height:1.5; margin-bottom:var(--space-6);
    }
    .unv-btns { display:flex; gap:var(--space-3); }
    .unv-go {
      flex:1; display:inline-flex; align-items:center; justify-content:center;
      font-family:var(--font-heading); font-size:var(--text-sm); font-weight:600; letter-spacing:0.05em;
      background:var(--lavender-400); color:#fff;
      border-radius:var(--radius-full); padding:var(--space-3) var(--space-4);
      text-decoration:none; transition:background 0.15s;
    }
    .unv-go:hover { background:var(--lavender-500); }
    .unv-cancel {
      flex:1; font-family:var(--font-heading); font-size:var(--text-sm); font-weight:500;
      background:var(--sand-200); color:var(--color-text-secondary);
      border:none; border-radius:var(--radius-full); padding:var(--space-3) var(--space-4);
      cursor:pointer; transition:background 0.15s;
    }
    .unv-cancel:hover { background:var(--sand-300, #e5d5b0); }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-logo">HUIHUI Travel</a>
  <ul class="navbar-links">
    <li><a href="https://blog.naver.com/kty1297" target="_blank" rel="noopener">블로그</a></li>
    <li><a href="gallery.html" class="active">갤러리</a></li>
    <li><a href="game.html">게임</a></li>
  </ul>
</nav>

<div class="page-header">
  <p class="page-eyebrow">Gallery</p>
  <h1 class="page-title">모든 여행의 장면들</h1>
  <p class="page-desc">열쇠를 눌러 여행의 기억을 열어보세요</p>
</div>

<section class="key-rack-section">
  <div class="key-rack" id="keyRack"></div>
</section>

<!-- Keyhole scene -->
<div class="kh-scene" id="khScene">
  <!-- Sphere -->
  <div class="kh-sphere-wrap" id="khSphereWrap">
    <div class="kh-photos" id="khPhotos"></div>
    <div class="kh-glass"></div>
    <button class="kh-arrow prev" id="khPrev">&#8592;</button>
    <button class="kh-arrow next" id="khNext">&#8594;</button>
    <div class="kh-nav" id="khDots"></div>
  </div>
  <!-- SVG keyhole overlay -->
  <svg class="kh-svg" id="khSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <mask id="kMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
        <rect fill="white" width="1000" height="1000"/>
        <circle id="khMaskCircle" fill="black" cx="500" cy="430" r="0"/>
        <polygon id="khMaskShaft" fill="black" opacity="0" points="468,486 456,598 544,598 532,486"/>
      </mask>
    </defs>
    <rect fill="rgb(6,3,15)" width="1000" height="1000" mask="url(#kMask)"/>
  </svg>
  <!-- UI layer -->
  <div class="kh-ui">
    <div class="kh-dest-label" id="khDestLabel"></div>
    <div class="kh-photo-label" id="khPhotoLabel"></div>
    <a href="#" class="kh-trip-link" id="khTripLink">코스 보기 →</a>
    <button class="kh-close" onclick="closeKeyhole()">✕</button>
  </div>
</div>

<!-- Unvisited popup -->
<div class="unv-overlay" id="unvOverlay" onclick="if(event.target===this)closeUnvisited()">
  <div class="unv-card">
    <span class="unv-icon">🔒</span>
    <p class="unv-msg" id="unvMsg"></p>
    <div class="unv-btns">
      <a href="#" class="unv-go" id="unvGo">여행하러 가기</a>
      <button class="unv-cancel" onclick="closeUnvisited()">닫기</button>
    </div>
  </div>
</div>

<script>
const DESTINATIONS = [
  { id:'yeosu',       nameKo:'여수',   tagline:'남해의 빛과 바다',     storageKey:'trip_yeosu_v1',       url:'trips/yeosu.html',       particle:'을' },
  { id:'icheon',      nameKo:'이천',   tagline:'도자기와 온천의 고장',  storageKey:'trip_icheon_v1',      url:'trips/icheon.html',      particle:'을' },
  { id:'paju',        nameKo:'파주',   tagline:'트렌디 아트 나들이',    storageKey:'trip_paju_v1',        url:'trips/paju.html',        particle:'를' },
  { id:'dongincheon', nameKo:'동인천', tagline:'레트로 감성 골목',      storageKey:'trip_dongincheon_v1', url:'trips/dongincheon.html', particle:'을' },
  { id:'gangneung',   nameKo:'강릉',   tagline:'커피향 가득한 해변',    storageKey:'trip_gangneung_v1',   url:'trips/gangneung.html',   particle:'을' },
  { id:'nowon',       nameKo:'노원',   tagline:'노원 나들이',           storageKey:'trip_nowon_v1',        url:'trips/nowon.html',       particle:'을' },
  { id:'suwon',       nameKo:'수원',   tagline:'역사가 살아있는 도시',  storageKey:'trip_suwon_v1',       url:'trips/suwon.html',       particle:'을' },
  { id:'daejeon',     nameKo:'대전',   tagline:'대전 여행',             storageKey:'trip_daejeon_v1',      url:'trips/daejeon.html',     particle:'을' },
];

/* ── DATA ── */
function getVisitedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('huihui_visited')||'[]')); }
  catch(e) { return new Set(); }
}
function getUserPhotos(storageKey) {
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return [];
    return JSON.parse(raw).flatMap(d=>d.places||[]).filter(p=>p.photo).map(p=>({photo:p.photo,name:p.name}));
  } catch(e) { return []; }
}

/* ── KEY RACK ── */
function _probeImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

async function renderKeyRack() {
  const visited = getVisitedSet();

  /* 키 이미지 존재 여부 병렬 체크 */
  const probeResults = await Promise.all(
    DESTINATIONS.map(dest => _probeImg(`assets/keys/${dest.id}.png`))
  );

  document.getElementById('keyRack').innerHTML = DESTINATIONS.map((dest, i) => {
    if (!probeResults[i]) {
      /* 키 이미지 없음 → 준비중 */
      return `<div class="key-item coming-soon">
        <div class="key-nametag">${dest.nameKo}</div>
        <div class="key-img-wrap"><div class="key-hook"></div>
          <div style="width:110px;height:160px;display:flex;align-items:center;justify-content:center;opacity:0.3;font-size:36px;margin-top:10px">🔑</div>
        </div>
        <div class="key-status-dot"></div>
      </div>`;
    }
    const isVisited = visited.has(dest.url);
    const cls = isVisited ? 'visited' : 'unvisited';
    return `<div class="key-item ${cls}" onclick="handleKeyClick('${dest.id}')">
      <div class="key-nametag">${dest.nameKo}</div>
      <div class="key-img-wrap">
        <div class="key-hook"></div>
        <img class="key-img" src="assets/keys/${dest.id}.png" alt="${dest.nameKo}">
      </div>
      <div class="key-status-dot"></div>
    </div>`;
  }).join('');
}

function handleKeyClick(id) {
  const dest = DESTINATIONS.find(d=>d.id===id);
  if (!dest) return;
  const visited = getVisitedSet();
  if (visited.has(dest.url)) {
    openKeyhole(dest);
  } else {
    showUnvisited(dest);
  }
}

/* ── SOUND ── */
function playClickSound() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const t = ctx.currentTime;
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc1.type = 'square'; osc1.frequency.setValueAtTime(900,t); osc1.frequency.exponentialRampToValueAtTime(300,t+0.06);
    osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(1200,t); osc2.frequency.exponentialRampToValueAtTime(200,t+0.05);
    gain.gain.setValueAtTime(0.18,t); gain.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
    osc1.start(t); osc1.stop(t+0.12);
    osc2.start(t); osc2.stop(t+0.08);
  } catch(e) {}
}

/* ── KEYHOLE ANIMATION ── */
let khAnimFrame = null;
let currentPhotos = [];
let currentPhotoIdx = 0;

async function openKeyhole(dest) {
  playClickSound();

  const photos = getUserPhotos(dest.storageKey);
  currentPhotos = photos;
  currentPhotoIdx = 0;

  // Load sphere content
  const photosEl = document.getElementById('khPhotos');
  if (photos.length === 0) {
    photosEl.innerHTML = `<div class="kh-photo-empty"><span>📷</span><span>아직 사진이 없어요</span><span style="font-style:normal;font-size:12px;opacity:0.6">여행 후 사진을 추가해보세요</span></div>`;
    document.getElementById('khDots').innerHTML = '';
  } else {
    photosEl.innerHTML = photos.map((p,i)=>`<div class="kh-photo${i===0?' active':''}" data-idx="${i}"><img src="${p.photo}" alt="${p.name}" loading="lazy"></div>`).join('');
    document.getElementById('khDots').innerHTML = photos.map((_,i)=>`<div class="kh-dot${i===0?' active':''}" onclick="goToPhoto(${i})"></div>`).join('');
    document.getElementById('khPhotoLabel').textContent = photos.length > 1 ? `${photos.length}장의 사진` : '';
  }
  updateArrows();

  document.getElementById('khDestLabel').textContent = dest.nameKo;
  document.getElementById('khTripLink').href = dest.url;

  // Show scene
  const scene = document.getElementById('khScene');
  scene.classList.add('active');
  document.body.style.overflow = 'hidden';

  // Phase 1: small keyhole appears (0 → 60px radius)
  await animateKeyhole(0, 62, 400, 'ease-out', true);
  // Phase 2: keyhole expands rapidly
  await animateKeyhole(62, 820, 700, 'ease-in', false);
  // Phase 3: switch to sphere
  scene.classList.add('sphere-visible');
  // Reset SVG hole to 0 (sphere takes over visually)
  setKeyholeR(0);
  document.getElementById('khMaskShaft').setAttribute('opacity','0');
}

function animateKeyhole(fromR, toR, duration, easing, showShaft) {
  return new Promise(resolve => {
    const circle = document.getElementById('khMaskCircle');
    const shaft  = document.getElementById('khMaskShaft');
    const start  = performance.now();

    if (showShaft) shaft.setAttribute('opacity', '1');

    function ease(t) {
      if (easing==='ease-out') return 1-(1-t)*(1-t);
      if (easing==='ease-in')  return t*t;
      return t;
    }

    function frame(now) {
      const p = Math.min((now-start)/duration, 1);
      const r = fromR + (toR-fromR)*ease(p);
      circle.setAttribute('r', r);
      if (!showShaft) {
        const opacity = Math.max(0, 1-(r-62)/180);
        shaft.setAttribute('opacity', opacity);
      }
      if (p < 1) {
        khAnimFrame = requestAnimationFrame(frame);
      } else {
        circle.setAttribute('r', toR);
        resolve();
      }
    }
    cancelAnimationFrame(khAnimFrame);
    khAnimFrame = requestAnimationFrame(frame);
  });
}

function setKeyholeR(r) {
  document.getElementById('khMaskCircle').setAttribute('r', r);
}

function closeKeyhole() {
  cancelAnimationFrame(khAnimFrame);
  const scene = document.getElementById('khScene');
  scene.classList.remove('active','sphere-visible');
  document.body.style.overflow = '';
  setKeyholeR(0);
  document.getElementById('khMaskShaft').setAttribute('opacity','0');
}

/* ── PHOTO CAROUSEL ── */
function goToPhoto(idx) {
  if (currentPhotos.length === 0) return;
  idx = Math.max(0, Math.min(currentPhotos.length-1, idx));
  document.querySelectorAll('.kh-photo').forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
  });
  document.querySelectorAll('.kh-dot').forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
  });
  currentPhotoIdx = idx;
  updateArrows();
}
function updateArrows() {
  const prev = document.getElementById('khPrev');
  const next = document.getElementById('khNext');
  if (prev) prev.disabled = currentPhotoIdx === 0;
  if (next) next.disabled = currentPhotoIdx >= currentPhotos.length-1;
}
document.getElementById('khPrev').onclick = () => goToPhoto(currentPhotoIdx-1);
document.getElementById('khNext').onclick = () => goToPhoto(currentPhotoIdx+1);

// Touch swipe inside sphere
let touchStartX = 0;
const sphere = document.getElementById('khSphereWrap');
sphere.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; }, {passive:true});
sphere.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 30) dx < 0 ? goToPhoto(currentPhotoIdx+1) : goToPhoto(currentPhotoIdx-1);
});

// Keyboard navigation
document.addEventListener('keydown', e=>{
  const scene = document.getElementById('khScene');
  if (!scene.classList.contains('active')) return;
  if (e.key==='ArrowRight') goToPhoto(currentPhotoIdx+1);
  if (e.key==='ArrowLeft')  goToPhoto(currentPhotoIdx-1);
  if (e.key==='Escape')     closeKeyhole();
});

/* ── UNVISITED POPUP ── */
function showUnvisited(dest) {
  const particle = dest.particle || '을';
  document.getElementById('unvMsg').innerHTML = `아직 <em>${dest.nameKo}</em>${particle}(를) 여행하지 않았어요!`;
  document.getElementById('unvGo').href = dest.url;
  document.getElementById('unvOverlay').classList.add('show');
}
function closeUnvisited() {
  document.getElementById('unvOverlay').classList.remove('show');
}

/* ── INIT ── */
renderKeyRack();
</script>
