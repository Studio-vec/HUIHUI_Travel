<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Travel HUIHUI</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 16px 8px;
    background:radial-gradient(circle at 20px 20px,rgba(192,168,255,.22) 2px,transparent 3px) 0 0/40px 40px,#FFF8EB;
    font-family:"Noto Sans KR","DM Sans",sans-serif;color:#2A1F48;
  }
  /* 가로 390px 고정 (프레임 안쪽 폭) */
  .phone{
    position:relative;flex:none;width:410px;height:min(860px,calc(100vh - 76px));
    padding:10px;border-radius:44px;background:#2A1F48;
    box-shadow:0 24px 60px rgba(42,31,72,.28),inset 0 0 0 2px rgba(255,255,255,.08);
  }
  .phone::before{
    content:"";position:absolute;left:50%;top:14px;width:84px;height:6px;border-radius:9px;
    background:rgba(255,255,255,.18);transform:translateX(-50%);z-index:2;pointer-events:none;
  }
  iframe{display:block;width:100%;height:100%;border:0;border-radius:34px;background:#fff}
  .pc{
    font:inherit;font-size:14px;font-weight:500;min-height:44px;padding:0 14px;border:0;background:none;
    color:#746A91;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(116,106,145,.4);
    transition:color .15s;
  }
  .pc:hover{color:#7B5CC4;text-decoration-color:currentColor}
  .pc:focus-visible{outline:3px solid #7B5CC4;outline-offset:2px;border-radius:8px}
</style>
</head>
<body>
  <div class="phone" id="phone">
    <iframe id="frame" name="hh-phone" title="모바일 화면 미리보기"></iframe>
  </div>
  <button class="pc" id="pc" type="button">PC 버전 보기</button>

<script>
(function () {
  // 같은 사이트의 경로만 허용. 정규식 검사는 '/\evil.com'(브라우저가 //evil.com으로 해석)을 통과시키므로 URL로 파싱해 origin을 비교한다
  function sameOriginPath(v) {
    try {
      var t = new URL(v, location.origin);
      return t.origin === location.origin ? t.pathname + t.search + t.hash : null;
    } catch (e) { return null; }
  }

  var params = new URLSearchParams(location.search);
  var u = sameOriginPath(params.get('u') || '/') || '/';

  var pref = null;
  try { pref = localStorage.getItem('hh-view'); } catch (e) {}
  // 모바일 보기가 꺼져 있거나 창이 좁으면 셸 없이 바로 원래 페이지로
  if (pref !== 'mobile' || window.innerWidth < 700) { location.replace(u); return; }

  var frame = document.getElementById('frame');
  frame.src = u;

  document.getElementById('pc').addEventListener('click', function () {
    try { localStorage.setItem('hh-view', 'desktop'); } catch (e) {}
    location.reload();                            // 현재 주소(또는 m.html)에서 PC 보기로 복귀
  });

  // 폰 화면 안에서 이동해도 주소창·제목을 따라가게 한다
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (e.origin !== location.origin || e.source !== frame.contentWindow || !d || d.hh !== 'nav') return;
    var href = typeof d.href === 'string' ? sameOriginPath(d.href) : null;
    if (href) {
      try { history.replaceState(null, '', href); } catch (x) {}
    }
    if (typeof d.title === 'string' && d.title) document.title = d.title;
  });
})();
</script>
</body>
</html>
