<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 320" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>HUIHUI 喜 노리개</title>
  <defs>
    <path id="g" d="M22 13H78M50 5V26M33 26H67M35 33H65A4 4 0 0 1 69 37V42A4 4 0 0 1 65 46H35A4 4 0 0 1 31 42V37A4 4 0 0 1 35 33ZM39 52L43.5 57M61 52L56.5 57M15 63H85M33 70H67A4 4 0 0 1 71 74V90A4 4 0 0 1 67 94H33A4 4 0 0 1 29 90V74A4 4 0 0 1 33 70Z"/>
    <!-- 생쪽매듭: 가운데 마름모에 네 귀 고리 -->
    <g id="knot">
      <path d="M0 -9L9 0L0 9L-9 0Z"/>
      <path d="M-5 -5C-11 -13 -2 -16 0 -9M5 -5C11 -13 2 -16 0 -9M-5 5C-11 13 -2 16 0 9M5 5C11 13 2 16 0 9M-5 -5C-13 -11 -16 -2 -9 0M-5 5C-13 11 -16 2 -9 0M5 -5C13 -11 16 -2 9 0M5 5C13 11 16 2 9 0"/>
    </g>
    <linearGradient id="tassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#952F39"/><stop offset=".55" stop-color="#B23A44"/><stop offset="1" stop-color="#C9545C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1E2B4"/><stop offset=".5" stop-color="#CFA94E"/><stop offset="1" stop-color="#8A6A22"/>
    </linearGradient>
  </defs>

  <!-- 걸이 고리 + 끈 -->
  <path d="M60 4C50 4 50 18 60 18C70 18 70 4 60 4ZM60 18V40" stroke="#B23A44" stroke-width="3.2"/>
  <path d="M60 18V40" stroke="#E3C77A" stroke-width=".9"/>
  <!-- 위 매듭 -->
  <g transform="translate(60 30)" stroke="#B23A44" stroke-width="3"><use href="#knot"/></g>
  <g transform="translate(60 30)" stroke="#E3C77A" stroke-width=".8"><use href="#knot"/></g>

  <!-- 원형 메달리온: 금 테 + 喜 -->
  <circle cx="60" cy="98" r="52" fill="#FFFDF8" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="60" cy="98" r="45" stroke="#CFA94E" stroke-width="1" stroke-dasharray="1.2 3.2"/>
  <g transform="translate(29 67) scale(.62)">
    <use href="#g" stroke="#B23A44" stroke-width="9"/>
    <use href="#g" stroke="#E3C77A" stroke-width="2"/>
  </g>

  <!-- 아래 끈 + 매듭 + 술머리 -->
  <path d="M60 150V196" stroke="#B23A44" stroke-width="3.2"/>
  <path d="M60 150V196" stroke="#E3C77A" stroke-width=".9"/>
  <g transform="translate(60 172)" stroke="#B23A44" stroke-width="3"><use href="#knot"/></g>
  <g transform="translate(60 172)" stroke="#E3C77A" stroke-width=".8"><use href="#knot"/></g>
  <path d="M50 206C50 198 54 194 60 194C66 194 70 198 70 206Z" fill="url(#gold)"/>
  <rect x="49" y="205" width="22" height="6" rx="1.5" fill="url(#gold)"/>
  <!-- 술 -->
  <path d="M50 211H70L76 310C70 314 50 314 44 310Z" fill="url(#tassel)"/>
  <path d="M54 214L51 308M58 214L57 310M62 214L63 310M66 214L69 308M60 214V311" stroke="#7A2530" stroke-width=".7" opacity=".55"/>
  <rect x="48.5" y="226" width="23" height="5" rx="1.5" fill="url(#gold)"/>
</svg>
