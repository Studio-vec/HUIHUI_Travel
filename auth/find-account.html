<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>아이디 / 비밀번호 찾기 – HUIHUI Travel</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --purple:       #7A57CD;
      --purple-light: #C8B1FF;
      --purple-pale:  #EDE5FF;
      --cream:        #FFF8EB;
      --green:        #8F9D68;
      --text:         #2a1a4a;
      --text-mid:     #5a3e8a;
      --text-dim:     #9a8ab0;
      --error:        #c04040;
      --ok:           #4a9a6a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(160deg, var(--cream) 0%, #e8dcff 50%, #c8b1ff 100%);
      padding: 24px 16px;
    }
    .receipt {
      width: min(320px, 92vw); background: var(--cream);
      position: relative;
      filter: drop-shadow(0 20px 40px rgba(122,87,205,0.22));
    }
    .receipt-top { width:100%; height:14px; background:var(--cream); position:relative; }
    .receipt-top::before {
      content:''; position:absolute; top:0; left:0; right:0; height:14px;
      background: radial-gradient(circle at 50% -1px, transparent 7px, var(--cream) 7px) -7px 0 / 14px 14px repeat-x;
    }
    .receipt-body { background:var(--cream); padding:10px 24px 24px; }
    .receipt-bottom { width:100%; height:14px; background:var(--cream); position:relative; }
    .receipt-bottom::after {
      content:''; position:absolute; bottom:0; left:0; right:0; height:14px;
      background: radial-gradient(circle at 50% calc(100% + 1px), transparent 7px, var(--cream) 7px) -7px 0 / 14px 14px repeat-x;
    }
    .logo-wrap { display:flex; flex-direction:column; align-items:center; padding:18px 0 14px; }
    .logo-circle {
      width:52px; height:52px; border-radius:50%;
      background: radial-gradient(circle at 38% 32%, #C8B1FF, #AB88FF 55%, #7A57CD);
      box-shadow: 2px 4px 8px rgba(0,0,0,0.12), inset -2px -4px 8px rgba(80,0,200,0.25);
      display:flex; align-items:center; justify-content:center; margin-bottom:8px;
    }
    .logo-circle span { font-family:'Playfair Display',serif; font-size:0.85rem; font-weight:900; color:white; letter-spacing:0.05em; }
    .receipt-title { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:900; color:var(--purple); }
    .receipt-sub { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.68rem; color:var(--text-dim); letter-spacing:0.15em; margin-top:2px; }
    .divider { border:none; border-top:1.5px dashed var(--purple-light); margin:12px 0; }
    .divider-solid { border:none; border-top:1px solid var(--purple-light); margin:10px 0; }

    /* 탭 */
    .tabs { display:flex; gap:4px; margin-bottom:14px; }
    .tab-btn {
      flex:1; height:34px; border-radius:999px;
      border: 1.5px solid var(--purple-light);
      background: none; cursor:pointer;
      font-family:'Noto Sans KR',sans-serif; font-size:0.72rem; font-weight:600;
      color: var(--text-dim); transition: all .15s;
    }
    .tab-btn.active {
      background: var(--purple); border-color: var(--purple);
      color: white; box-shadow: 0 2px 8px rgba(122,87,205,0.3);
    }

    /* 패널 */
    .panel { display:none; }
    .panel.active { display:block; }

    .field { margin-bottom:12px; }
    .field-label { font-size:0.6rem; font-weight:700; color:var(--green); letter-spacing:0.14em; margin-bottom:5px; display:block; }
    .input-box {
      width:100%; height:40px; background:white;
      border:1.5px solid var(--purple-light); border-radius:999px;
      padding:0 14px; font-size:0.82rem;
      font-family:'Noto Sans KR',sans-serif; color:var(--text); outline:none;
      transition: border-color .2s;
    }
    .input-box:focus { border-color:var(--purple); }
    .input-box::placeholder { color:var(--text-dim); font-size:0.75rem; }

    /* 결과 박스 */
    .result-box {
      display:none; border-radius:14px;
      padding:14px 16px; margin:8px 0;
      font-size:0.8rem; line-height:1.6;
    }
    .result-box.ok    { background:rgba(74,154,106,0.1); border:1px solid rgba(74,154,106,0.3); color:#2a6a40; }
    .result-box.error { background:rgba(192,64,64,0.08); border:1px solid rgba(192,64,64,0.25); color:var(--error); }
    .result-box.show  { display:block; }
    .result-id {
      font-family:'Playfair Display',serif; font-size:1.1rem;
      font-weight:700; color:var(--purple); margin-top:4px;
      letter-spacing:0.04em;
    }

    .btn-submit {
      width:100%; height:42px; background:var(--purple);
      border:none; border-radius:999px;
      font-size:0.72rem; font-weight:700; color:white; letter-spacing:0.1em; text-transform:uppercase;
      cursor:pointer; font-family:'Noto Sans KR',sans-serif;
      box-shadow:0 4px 14px rgba(122,87,205,0.3);
      transition:transform .15s, box-shadow .15s; margin-top:4px;
    }
    .btn-submit:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(122,87,205,0.4); }
    .btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none !important; }

    .receipt-links { display:flex; justify-content:center; gap:14px; margin-top:14px; }
    .receipt-links a { font-size:0.68rem; color:var(--green); text-decoration:none; }
    .receipt-links a:hover { color:var(--purple); text-decoration:underline; }
    .receipt-links span { color:var(--purple-light); }

    .loading-spinner {
      display:inline-block; width:12px; height:12px;
      border:2px solid rgba(255,255,255,0.4); border-top-color:white;
      border-radius:50%; animation:spin .6s linear infinite; margin-right:6px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<div class="receipt">
  <div class="receipt-top"></div>
  <div class="receipt-body">

    <div class="logo-wrap">
      <div class="logo-circle"><span>HH</span></div>
      <div class="receipt-title">HELP DESK</div>
      <div class="receipt-sub">ACCOUNT RECOVERY</div>
    </div>

    <hr class="divider-solid"/>

    <!-- 탭 -->
    <div class="tabs">
      <button class="tab-btn" id="tabId" onclick="switchTab('id')">아이디 찾기</button>
      <button class="tab-btn" id="tabPw" onclick="switchTab('pw')">비밀번호 찾기</button>
    </div>

    <!-- 아이디 찾기 패널 -->
    <div class="panel" id="panelId">
      <p style="font-size:0.72rem;color:var(--text-dim);margin-bottom:12px;line-height:1.5;">
        가입 시 등록한 이메일을 입력하면<br>아이디를 알려드려요.
      </p>
      <div class="field">
        <label class="field-label">이메일</label>
        <input class="input-box" type="email" id="findIdEmail" placeholder="가입한 이메일 주소"/>
      </div>
      <div class="result-box" id="findIdResult"></div>
      <button class="btn-submit" id="findIdBtn" onclick="findId()">아이디 찾기</button>
    </div>

    <!-- 비밀번호 찾기 패널 -->
    <div class="panel" id="panelPw">
      <p style="font-size:0.72rem;color:var(--text-dim);margin-bottom:12px;line-height:1.5;">
        가입한 이메일로 비밀번호 재설정<br>링크를 보내드려요.
      </p>
      <div class="field">
        <label class="field-label">이메일</label>
        <input class="input-box" type="email" id="findPwEmail" placeholder="가입한 이메일 주소"/>
      </div>
      <div class="result-box" id="findPwResult"></div>
      <button class="btn-submit" id="findPwBtn" onclick="findPw()">재설정 메일 보내기</button>
    </div>

    <hr class="divider"/>
    <div class="receipt-links">
      <a href="login.html">← 로그인으로</a>
      <span>·</span>
      <a href="register.html">회원가입</a>
    </div>

  </div>
  <div class="receipt-bottom"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
  /* URL 파라미터로 초기 탭 결정 */
  const initMode = new URLSearchParams(location.search).get('mode') || 'id';
  switchTab(initMode);

  function switchTab(mode) {
    document.getElementById('tabId').classList.toggle('active',  mode === 'id');
    document.getElementById('tabPw').classList.toggle('active',  mode === 'pw');
    document.getElementById('panelId').classList.toggle('active', mode === 'id');
    document.getElementById('panelPw').classList.toggle('active', mode === 'pw');
    history.replaceState(null,'', '?mode=' + mode);
  }

  function showResult(id, msg, type) {
    const el = document.getElementById(id);
    el.innerHTML = msg;
    el.className = 'result-box ' + type + ' show';
  }

  /* 아이디 찾기 */
  async function findId() {
    const email = document.getElementById('findIdEmail').value.trim();
    const btn   = document.getElementById('findIdBtn');
    if (!email) { showResult('findIdResult','이메일을 입력해주세요','error'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showResult('findIdResult','이메일 형식을 확인해주세요','error'); return; }
    if (!window._sb) { showResult('findIdResult','서버 연결을 확인해주세요','error'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>찾는 중…';

    try {
      const { data: username, error } = await window._sb.rpc('get_username_by_email', { p_email: email });
      if (error || !username) throw new Error('해당 이메일로 가입된 계정이 없어요');
      showResult('findIdResult',
        `가입된 아이디를 찾았어요!<div class="result-id">${username}</div>`,
        'ok'
      );
    } catch (e) {
      showResult('findIdResult', e.message, 'error');
    }

    btn.disabled = false;
    btn.textContent = '아이디 찾기';
  }

  /* 비밀번호 재설정 메일 */
  async function findPw() {
    const email = document.getElementById('findPwEmail').value.trim();
    const btn   = document.getElementById('findPwBtn');
    if (!email) { showResult('findPwResult','이메일을 입력해주세요','error'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showResult('findPwResult','이메일 형식을 확인해주세요','error'); return; }
    if (!window._sb) { showResult('findPwResult','서버 연결을 확인해주세요','error'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>전송 중…';

    try {
      const { error } = await window._sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://huihui-travel.vercel.app/auth/reset-password.html'
      });
      if (error) throw error;
      showResult('findPwResult',
        '재설정 링크를 보냈어요.<br>이메일함을 확인해주세요. 📬<br><span style="font-size:0.65rem;color:#9a8ab0">스팸함도 확인해보세요</span>',
        'ok'
      );
    } catch (e) {
      showResult('findPwResult',
        e.message.includes('not found') || e.message.includes('User')
          ? '해당 이메일로 가입된 계정이 없어요'
          : e.message || '오류가 발생했어요',
        'error'
      );
    }

    btn.disabled = false;
    btn.textContent = '재설정 메일 보내기';
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const mode = new URLSearchParams(location.search).get('mode') || 'id';
    if (mode === 'id') findId(); else findPw();
  });
</script>
</body>
</html>
